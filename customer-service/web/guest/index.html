  /**
   * 高度上报脚本：沙箱 iframe 是跨源隔离的（opaque origin），父页面既读不到
   * contentDocument，子文档也不能主动访问父页面。唯一安全的自动测量方式是给
   * 它一次 postMessage 的机会——所以只放行这一段由本页写入的脚本（CSP 用随机
   * nonce 锁定），模型自己写的脚本/内联事件仍被 CSP 拒绝执行。
   */
  const HTML_HEIGHT_REPORTER = 'addEventListener("load",function(){'
    + 'var last=0;'
    + 'function report(){var h=document.documentElement.scrollHeight;if(h===last)return;last=h;'
    + 'parent.postMessage({dshHtmlHeight:h},"*")}'
    + 'report();addEventListener("resize",report);'
    + 'if(window.ResizeObserver){new ResizeObserver(function(){'
    + 'requestAnimationFrame(report)})'
    + '.observe(document.body||document.documentElement)}'
    + '},false);'

  /**
   * ```html 代码块 → 沙箱预览。模型输出一律按不可信内容处理：iframe 用
   * sandbox="allow-scripts"（只给脚本执行权、绝不给 same-origin），srcdoc 内再用
   * CSP 把脚本限制到本页写入的那一段（随机 nonce），并禁止表单提交、外部请求与
   * base-uri。因此 HTML 能正常排版、能自适应高度，却拿不到本页 DOM/Cookie。
   * 高度由子文档回传、父页面按视口夹紧（手机不会一屏占满，PC 不会截断内容）。
   *
   * 门禁（C3）：空白块、超过单块字节上限的块一律降级为可读文案，绝不把可疑内容
   * 塞进沙箱。沙箱属性与 CSP 是安全不变量，不得因门禁而放宽。
   */
  function renderHtmlBlock(body) {
    const checked = G.checkHtmlBlock(body, GATE_MAX_BLOCK_BYTES)
    if (!checked.ok) return evidenceHint('html', checked.reason, body)
    const nonce = Math.random().toString(36).slice(2) + Date.now().toString(36)
    const doc = '<!doctype html><meta charset="utf-8">'
      + `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; form-action 'none'; base-uri 'none'; script-src 'nonce-${nonce}'">`
      + `<style>${HTML_PREVIEW_CSS}</style>`
      + body
      // 注意：字符串里必须是 <\/script>，否则 HTML 解析器会提前结束本页脚本块
      + `<script nonce="${nonce}">${HTML_HEIGHT_REPORTER}<\/script>`
    return '<div class="html-block">'
      + `<iframe class="html-frame" sandbox="allow-scripts" referrerpolicy="no-referrer" loading="lazy" title="HTML 预览" srcdoc="${esc(doc)}"></iframe>`
      + '</div>'
  }

  /** 把某个预览 iframe 的高度设为「内容高度」，并按当前视口夹紧。 */
  function applyHtmlFrameHeight(frame) {
    const content = Number(frame.dataset.contentHeight || 0)
    if (!content) return
    const max = Math.min(Math.round(window.innerHeight * 0.85), 900)
    const target = Math.min(Math.max(content + 2, 120), max)
    // 小于 2px 的变化忽略：亚像素级来回会把「测量 → 设高 → 再测量」变成抖动
    if (Math.abs(target - Number(frame.dataset.appliedHeight || 0)) < 2) return
    frame.dataset.appliedHeight = String(target)
    frame.style.height = `${target}px`
    frame.dataset.clamped = content + 2 > max ? '1' : ''
  }

  /**
   * 接收预览子文档回传的内容高度。只认本页自己的 iframe（比对 event.source），
   * 沙箱 origin 为 null 不可作为判据；窗口尺寸变化时按新视口重新夹紧。
   */
  window.addEventListener('message', event => {
    const data = event.data
    if (!data || typeof data.dshHtmlHeight !== 'number') return
    const frame = [...document.querySelectorAll('.html-frame')].find(item => item.contentWindow === event.source)
    if (!frame) return
    frame.dataset.contentHeight = String(Math.max(0, Math.round(data.dshHtmlHeight)))
    applyHtmlFrameHeight(frame)
  })

  window.addEventListener('resize', () => {
    for (const frame of document.querySelectorAll('.html-frame')) applyHtmlFrameHeight(frame)
  })

  // ── 图形门禁执行端（需求 §5/§10/§11；决策逻辑全在 assets/output-gate.js）─────
  // 页面这一层只做三件事：按结论创建元素、把真机实测数据交给判据、把失败回传给
  // 服务端留痕。判断「能不能显示」的规则一行都不写在这里（Q2 分层）。
  const gate = window.DshOutputGate
  if (!gate) {
    // 门禁脚本没加载成功：这是 C8 明确禁止「把未校验的块直接渲染」的情形。页面
    // 不抛异常、不影响文字回答，但记录一次以便定位资产缺失。
    console.warn('[guest] output-gate.js 未加载，图形块将一律降级')
  }
  const NO_GATE = {
    GATE_REASONS: { libraryUnavailable: 'library-unavailable', renderEmpty: 'render-empty' },
    // 三态补全：页面按 `G.GATE_STATES.<state>` 取状态字面量，缺键得到 undefined
    // （不抛错，但会让状态机判断失真）。与真实模块同形，属完整性项。
    GATE_STATES: {
      absent: 'absent', pending: 'pending', loading: 'loading',
      validating: 'validating', passed: 'passed', degraded: 'degraded',
    },
    PENDING_KEY: 'gatePreparing',
    DEFAULT_REPORT_PATH: '/api/guest/render-report',
    // 与真实模块同值（C5 异常宽高比阈值）。它是页面真实访问的成员（判据入参），
    // 缺失会让 `checkRendered(..., {maxAspectRatio: undefined})` 走到非预期分支。
    DEFAULT_MAX_ASPECT_RATIO: 40,
    // 完整性项（**非崩溃点**）：页面仅在注释里提到该名字，无真实成员访问；补上
    // 以免后人按名字检索时看到一个"看起来应该有"的缺口。取值与 §12 冻结默认一致。
    blockTimeoutMs: 1500,
    DEGRADE_KEYS: {
      mermaid: 'gateDiagramUnavailable', chart: 'gateChartUnavailable',
      image: 'gateImageUnavailable', html: 'gateRichContentUnavailable',
    },
    checkImagePath: () => ({ ok: false, path: null, reason: 'image-path-invalid' }),
    toImageSrc: () => null,
    checkChartData: () => ({ ok: false, rows: null, reason: 'chart-invalid' }),
    checkHtmlBlock: () => ({ ok: false, reason: 'html-invalid' }),
    checkRendered: () => ({ ok: false, reason: 'render-empty', detail: null }),
    /**
     * 受控块类型规范化（与真实模块同形）：`img` 归一为 `image`，未知类型返回 null。
     * 页面按 `G.normalizeBlockType(x) || 'html'` 使用，故 null 是安全的降级值。
     * @param value - 待规范化的块类型
     * @returns 规范类型或 null
     */
    normalizeBlockType: value => {
      const v = typeof value === 'string' ? value.toLowerCase() : ''
      if (v === 'img') return 'image'
      return ['mermaid', 'chart', 'image', 'html'].indexOf(v) === -1 ? null : v
    },
    /**
     * 块来源单一裁决（与真实模块同口径）。
     * @param input - `{ sawBlockEvent }`
     * @returns 来源标识
     */
    chooseBlockSource: input => ((input && input.sawBlockEvent) ? 'block-events' : 'fence-fallback'),
    /**
     * 载荷解码（降级版）：**必须返回非空 `block`** —— 页面在 `applyBlockPayload` 里
     * 直接读 `decoded.block.blockType`，返回 null 会抛 `Cannot read properties of null`，
     * 反而把"降级"变成"整条回答失败"（正是本缺陷要消灭的形态）。故给出
     * `decision:'degraded'` 的空源码块，让每个块都落到可读降级文案。
     * @param payload - 主机侧 block 事件载荷
     * @returns `{ ok:false, block }`
     */
    decodeBlockPayload: payload => {
      const raw = payload && typeof payload === 'object' ? payload : {}
      return {
        ok: false,
        block: {
          blockId: typeof raw.blockId === 'string' ? raw.blockId : '',
          blockType: NO_GATE.normalizeBlockType(raw.blockType) || 'html',
          source: '',
          sourceBytes: 0,
          decision: 'degraded',
          reason: NO_GATE.GATE_REASONS.libraryUnavailable,
        },
      }
    },
    // 门禁资产缺失时文字照常上屏、图形块全降级：围栏识别交给 renderMarkdown 自身的
    // 兜底分支（未闭合 → 占位；已闭合 → 交回上面这些一律判失败的判据），整条回答
    // 不会因为门禁而失败（C8）。
    byteLength: text => String(text === null || text === undefined ? '' : text).length,
    shortDigest: text => String(text === null || text === undefined ? '' : text).length.toString(16),
    textKeyFor: (state, type) => (state === 'degraded'
      ? (NO_GATE.DEGRADE_KEYS[type] || 'gateRichContentUnavailable')
      : 'gatePreparing'),
    createReportDeduper: () => ({ shouldSend: () => false, reset: () => {} }),
    buildReport: () => null,
  }
  const G = gate || NO_GATE

  // 门禁预算与端点：默认值与 guest-server Config 的冻结默认值一致（§12）；服务端
  // 若在 `meta` 事件里下发 gate 字段则以服务端为准，保证单点可调（G1）。
  let GATE_BLOCK_TIMEOUT_MS = 1500
  let GATE_ANSWER_WAIT_BUDGET_MS = 600
  let GATE_LIBRARY_LOAD_TIMEOUT_MS = 8000
  let GATE_MAX_BLOCK_BYTES = 32768
  let GATE_REPORT_PATH = G.DEFAULT_REPORT_PATH || '/api/guest/render-report'

  /**
   * 采纳服务端下发的门禁配置（缺项保持默认，非法值直接忽略）。
   * @param config - `meta`/`done` 事件里的 `gate` 字段
   */
  function applyGateConfig(config) {
    if (!config || typeof config !== 'object') return
    const pick = (key, current) => (Number.isFinite(config[key]) && config[key] > 0 ? config[key] : current)
    GATE_BLOCK_TIMEOUT_MS = pick('blockTimeoutMs', GATE_BLOCK_TIMEOUT_MS)
    GATE_ANSWER_WAIT_BUDGET_MS = pick('answerWaitBudgetMs', GATE_ANSWER_WAIT_BUDGET_MS)
    GATE_LIBRARY_LOAD_TIMEOUT_MS = pick('libraryLoadTimeoutMs', GATE_LIBRARY_LOAD_TIMEOUT_MS)
    GATE_MAX_BLOCK_BYTES = pick('maxBlockBytes', GATE_MAX_BLOCK_BYTES)
    if (typeof config.reportPath === 'string' && config.reportPath.startsWith('/')) {
      GATE_REPORT_PATH = config.reportPath
    }
  }


  /** 本轮回答的起点与回传去重器（每轮 send() 开始时重置）。 */
  let gateTurnStart = Date.now()
  /** `done` 帧到达时刻，作为 T1 预算（≤600ms）的起点。 */
  let doneFrameAt = 0
  const reportDeduper = G.createReportDeduper()

  /**
   * 本轮已结算的块状态（blockKey → state）。用于 P7 的「`done` 前结算窗口」：
   * 到 `done` 仍未结算的块必须按降级处理，且**不得阻塞 `done`**。
   */
  const settledGates = new Set()

  // ── 口径 B：主机侧结构化 block 事件的访客端台账（E5/E6）─────────────────
  // 主机侧（plugins/output-gate）在 delta 流上做跨分帧识别，把图形块摘成三件事：
  // `block-open`（占位）→ `block`（裁决结果）→ `done`（blocks/blockResults 权威终态）。
  // 访客端只消费这些事件，不再自行从文字流里解析围栏——这是「主机侧不可绕过」
  // 在访客端的落点（E2），也保证围栏源码从不进入访客 DOM 或内存文本。
  const blockSlots = new Map()
  const blockOrder = []
  /**
   * 本轮是否收到过 block 事件。它是**唯一的块来源开关**：一旦为 true，正文围栏
   * 扫描即停止产出图形块，避免同一轮内出现两个事实源（重复渲染/互相覆盖）。
   * 裁决规则在 output-gate.js 的纯函数 `chooseBlockSource`，页面不自己判。
   */
  let sawBlockEvent = false

  /**
   * 当前轮的块来源裁决（委托纯函数，可单测）。
   *
   * **该兜底分支仅服务旧后端**（部署早于 t3、正文仍含围栏、不下发 block 事件）。
   * 口径 B 下 `delta` 正文已被主机侧摘空，这里根本不会命中围栏；一旦本轮收到任何
   * `block-open`/`block`，本函数即返回 `'block-events'`，围栏路径被门控短路——
   * 因此它不会演变成「第二事实源」，而是旧后端兼容层。守护测试见
   * `tests/output-gate-check.mjs` 的「块来源唯一裁决」与「页面把块来源收敛到单一
   * 裁决点」两条，以及 `tests/gate-dom-check.mjs` 的「路径 B（兜底）」。
   *
   * 触发时机刻意放在**每帧**而不是只在 `done`：旧后端流式期围栏会分帧到达，
   * 若只在 `done` 才解析，中间那些帧的正文里就是明文围栏（实测会命中 V1/SRC5
   * 泄漏判据）。每帧解析保证任何时刻都不裸奔（实测 30 采样点泄漏 0）。
   * @returns `'block-events'`（主机侧权威，口径 B）或 `'fence-fallback'`（旧后端兜底）
   */
  function blockSourcePolicy() {
    return G.chooseBlockSource({ sawBlockEvent })
  }

  /**
   * 取（必要时创建）某气泡的 block 槽位容器。按气泡隔离——多个回答同时在屏时
   * 各自的块不能互相串。
   */
  function blocksHostOf(bubble) {
    let host = bubble.querySelector(':scope > .gate-blocks')
    if (!host) {
      host = document.createElement('div')
      host.className = 'gate-blocks'
      bubble.appendChild(host)
    }
    return host
  }

  /** 把 `block` 事件的裁决结果并入槽位台账。 */
  function applyBlockPayload(decoded, raw) {
    const blockId = (raw && raw.blockId) || decoded.block.blockId
    const slot = blockSlots.get(blockId) || { blockId, blockType: decoded.block.blockType || 'html' }
    slot.blockType = decoded.block.blockType || slot.blockType
    slot.decision = decoded.block.decision
    slot.reason = decoded.block.reason || ''
    if (decoded.ok) {
      slot.source = decoded.block.source
      slot.sourceBytes = decoded.block.sourceBytes
      slot.imagePath = decoded.block.imagePath || ''
      slot.imageCaption = decoded.block.imageCaption || ''
    } else {
      // 降级：主机侧已判定不可显示，或载荷异常——两种情况都不持有源码
      slot.source = ''
      slot.decision = 'degraded'
    }
    blockSlots.set(blockId, slot)
    if (!blockOrder.some(item => item.blockId === blockId)) {
      blockOrder.push({ blockId, blockType: slot.blockType })
    }
  }

  /** 用 `done` 下发的权威终态纠正本地槽位（E1：三出口终态一致）。 */
  function adoptDoneBlocks(data) {
    const results = data.blockResults && typeof data.blockResults === 'object' ? data.blockResults : {}
    const degraded = Array.isArray(data.degradedIds) ? data.degradedIds : []
    for (const payload of data.blocks) {
      if (!payload || typeof payload.blockId !== 'string') continue
      const decoded = G.decodeBlockPayload(payload)
      const slot = blockSlots.get(payload.blockId)
      // 已进入 passed 的块不回改（REP5）；其余按 done 的权威结论补齐
      if (slot && slot.decision === 'render' && slot.settled === 'passed') continue
      applyBlockPayload(decoded, payload)
      const target = blockSlots.get(payload.blockId)
      if (degraded.indexOf(payload.blockId) !== -1 || results[payload.blockId] === 'degraded') {
        target.decision = 'degraded'
        target.source = ''
      }
    }
  }

  /**
   * 刷新槽位容器：重渲染 HTML，但把已开判/已终态的**真节点**原位搬回。
   * 直接 `innerHTML = ...` 会把在飞的 mermaid 容器与 `<img>` 一起销毁（同一块
   * 反复从 pending 重来），所以刷新必须与 `paintStream` 一样做节点搬运。
   * @param bubble - 气泡
   * @returns 槽位容器
   */
  function refreshBlockSlots(bubble) {
    const host = blocksHostOf(bubble)
    const live = new Map()
    for (const node of host.querySelectorAll('[data-block-key]')) {
      const state = node.dataset.blockState
      if (state && state !== G.GATE_STATES.pending) live.set(node.dataset.blockKey, node)
    }
    host.innerHTML = renderBlockSlots()
    for (const placeholder of host.querySelectorAll('[data-block-key]')) {
      const node = live.get(placeholder.dataset.blockKey)
      if (node) placeholder.replaceWith(node)
    }
    return host
  }

  /**
   * 渲染 block 槽位容器。三种形态：
   * - `decision` 未定（只收到了 `block-open`）→ **占位**（判定期唯一允许的呈现）
   * - `decision === 'render'` → 占位（真机裁决由 startClosedGates 接手）
   * - `decision === 'degraded'` → 可读降级文案
   * 源码只进内存台账，任何形态都不把它写进 DOM。
   */
  function renderBlockSlots() {
    return blockOrder.map(item => {
      const slot = blockSlots.get(item.blockId) || { blockType: item.blockType }
      const type = slot.blockType || 'html'
      // `block-open` 之后的待裁决态：只出占位（不得当成 degraded，否则块在裁决
      // 到达前就被判死；也不得渲染，因为源码还没到）
      if (slot.decision === undefined || slot.decision === null) {
        return `<div class="gate-block" data-block-type="${esc(type)}" data-block-state="pending">${pendingPlaceholder()}</div>`
      }
      if (slot.decision === 'render') {
        // 交真机裁决：图片用主机侧给的归一化路径（无需源码即可判 C4）
        const key = registerBlockSource(type === 'image' ? (slot.imagePath || '') : (slot.source || ''), item.blockId)
        if (type === 'image') {
          imageCaptions.set(key, slot.imageCaption || '')
          return `<figure class="kb-image" data-block-state="pending" data-block-key="${esc(key)}" data-block-id="${esc(item.blockId)}">${pendingPlaceholder()}</figure>`
        }
        if (type === 'mermaid') {
          return `<div class="mermaid-src" data-block-state="pending" data-block-key="${esc(key)}" data-block-id="${esc(item.blockId)}">${pendingPlaceholder()}</div>`
        }
        if (type === 'chart') {
          return `<div class="chart" data-block-state="pending" data-block-key="${esc(key)}" data-block-id="${esc(item.blockId)}">${pendingPlaceholder()}</div>`
        }
        return `<div class="gate-block" data-block-type="html" data-block-state="pending" data-block-key="${esc(key)}" data-block-id="${esc(item.blockId)}">${pendingPlaceholder()}</div>`
      }
      // 主机侧已判 degraded，或载荷异常：直接可读降级（绝不显示源码）
      return degradeElement(type)
    }).join('')
  }

  /**
   * 收尾窗口（P7 v3.2）：`done` 到达后，门禁最多再等这么久让在飞的块结算；
   * 到点未结算的块一律走降级终态。取值 `gate.answerWaitBudgetMs`（默认 600ms），
   * 它是**窗口**而不是串行总配额——各块判定并行推进、互不占用。
   */
  function settleWindowMs() {
    return typeof GATE_ANSWER_WAIT_BUDGET_MS === 'number' && GATE_ANSWER_WAIT_BUDGET_MS > 0
      ? GATE_ANSWER_WAIT_BUDGET_MS
      : 600
  }

  /**
   * 块源码的内存台账（blockKey → 源码）。源码**只**存在这里，绝不写进 DOM 属性：
   * V4 的证据形式是抓 `.bubble` 的 outerHTML，任何落在属性里的源码都会在快照里
   * 命中"出现该块源码文本"这一判据。
   */
  const blockSources = new Map()

  /**
   * 本地扫描路径（无 block 事件时）的稳定键。
   *
   * 不能用扫描序号：正文每增长一行，同一个块的序号就可能变化，键一变，节点搬运
   * （`paintStream`/`refreshBlockSlots`）就失配、块被重置。这里用「类型 + 源码摘要」
   * 定键——同一块在任何帧都得到同一个键。
   * @param type - 块类型
   * @param source - 块体源码（图片块为站点路径）
   * @param block - 块描述（当前未用，保留参数以便未来换用服务端 id）
   * @returns 稳定键
   */
  function localGateKey(type, source, block) {
    void block
    return registerBlockSource(source, `${type}-${G.shortDigest(source)}`)
  }

  /**
   * 登记块源码，返回可用于在 DOM 上指回它的键（键本身不含源码）。
   *
   * 键必须**稳定**：同一处块在每次重渲染时都要拿到同一个键，否则节点搬运
   * （`paintStream`/`refreshBlockSlots` 靠 `data-block-key` 回填在飞节点）永远
   * 匹配不上，块会被反复重置为 pending 并在重建中丢失；同时递增计数会让台账无限增长。
   * @param source - 块体源码（或图片块的站点路径）
   * @param stableId - 稳定标识（口径 B 用主机侧 blockId，本地扫描用序号）
   * @returns 稳定键
   */
  function registerBlockSource(source, stableId) {
    // 键必须是「稳定 id + 内容摘要」的复合键：只按 id 登记时，不同轮次如果拿到
    // 相同 id（服务端早期 blockId 只含会话+序号，每轮从 0 重来），后登记的源码会
    // 覆盖前一个 → 历史里每张图都渲染成同一张（实测故障）。带上内容摘要后，
    // 内容不同的块永不互相覆盖；内容相同则天然复用同一份源码。
    const digest = G.shortDigest(source || '')
    const key = stableId === undefined || stableId === null || stableId === ''
      ? `blk-${digest}`
      : `blk-${stableId}-${digest}`
    blockSources.set(key, source)
    return key
  }

  /** 取回块源码（键不存在时返回空串，调用方按降级处理）。 */
  function blockSourceOf(key) {
    return typeof key === 'string' && blockSources.has(key) ? blockSources.get(key) : ''
  }

  /** 图片图注台账（同样只放内存，不放 DOM 属性）。 */
  const imageCaptions = new Map()

  /**
   * 几何类失败回传服务端（O3）：只送类型/原因/摘要/字节数，**不含源码**；幂等去重
   * 后 fire-and-forget，任何异常都吞掉——回传失败绝不影响访客已看到的内容。
   * @param blockType - 四类块之一
   * @param reason - O2 枚举内的原因
   * @param source - 块源码（仅用于本地算摘要）
   * @param blockId - 块 id（幂等键的一部分）
   */
  function reportGateFailure(blockType, reason, source, blockId) {
    try {
      const payload = G.buildReport({
        sessionId: sessionId || '',
        blockId: blockId || `anon-${gateTurnStart}`,
        blockType,
        reason,
        source,
        outcome: 'degraded',
      })
      if (!payload) return
      if (!reportDeduper.shouldSend(payload.blockId, payload.sourceDigest)) return
      fetch(`${API_BASE}${GATE_REPORT_PATH}`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload),
        keepalive: true,
      }).catch(() => { /* 离线/限流：留痕丢了就丢了，访客内容不受影响 */ })
    } catch { /* 组装失败同样静默：回传永远不是访客能感知的路径 */ }
  }

  /**
   * 真机渲染**成功**回传（F-4）。
   *
   * 此前只有失败回传，主机侧因此无法区分「真机真的把图渲染出来了」与「等待窗口
   * 内没收到任何回传 ⇒ 按结构性结论记 passed」——`blockResults = 'passed'` 这两种
   * 来源在留痕里完全一样，运维无法确认访客是否真的看到了图。本函数补齐成功路径。
   *
   * 与失败回传同口径：复用 `reportDeduper` 幂等（同块同摘要只发一次，避免每帧重
   * 传）、fire-and-forget、任何异常都吞掉——回传永远不是访客能感知的路径。
   * @param blockType - 四类块之一
   * @param source - 块源码（图片块为站点路径；用于生成摘要与幂等键）
   * @param blockId - 主机侧块 id（静态路径传本地派生 id）
   */
  function reportGatePassed(blockType, source, blockId) {
    try {
      const payload = G.buildReport({
        sessionId: sessionId || '',
        blockId: blockId || `anon-${gateTurnStart}`,
        blockType,
        reason: '',
        source,
        outcome: 'passed',
      })
      if (!payload) return
      if (!reportDeduper.shouldSend(payload.blockId, payload.sourceDigest)) return
      fetch(`${API_BASE}${GATE_REPORT_PATH}`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload),
        keepalive: true,
      }).catch(() => { /* 离线/限流：留痕丢了就丢了，访客内容不受影响 */ })
    } catch { /* 组装失败同样静默：回传永远不是访客能感知的路径 */ }
  }

  /** 可读降级元素（D1/D2/REP3）：一句访客能读懂的话，不含源码与技术词。 */
  function degradeText(blockType) {
    const key = G.textKeyFor(G.GATE_STATES.degraded, blockType)
    return t(key)
  }

  /** 降级元素标记：data-block-state 供真机 DOM 快照断言（V2/V3）。 */
  function degradeElement(blockType) {
    return `<div class="gate-degraded" data-block-state="degraded">${esc(degradeText(blockType))}</div>`
  }

  /**
   * 静态渲染路径（历史恢复 / 非流式回答）的失败出口：既降级，又留痕。
   * @param blockType - 四类块之一
   * @param reason - O2 枚举内的原因
   * @param source - 块源码
   * @returns 降级元素 HTML
   */
  function evidenceHint(blockType, reason, source) {
    reportGateFailure(blockType, reason, source, `static-${blockType}-${G.shortDigest(source)}`)
    return degradeElement(blockType)
  }

  /**
   * 把**已通过 C2 判据**的图表数据渲染成横向条形行。
   *
   * 判据（JSON 合法 / 非空数组 / 标签非空 / 数值有限非负）由 output-gate.js 的
   * `checkChartData` 负责，在 `settleGatePlaceholders` 里调用；本函数是纯渲染，
   * 不再持有任何降级分支——旧实现在这里把原始 JSON 当代码块贴进气泡（源码回退）。
   * @param rows - `{ label, value }[]`（已判定合法）
   * @returns 图表内部 HTML
   */
  function renderChartRows(rows) {
    const max = Math.max(...rows.map(row => row.value), 1)
    return rows.map(row => {
      const pct = max > 0 ? Math.round(row.value / max * 100) : 0
      return `<div class="bar-row"><span class="label">${esc(row.label)}</span><div class="bar" style="width:${Math.max(pct, 2)}%"></div><span>${row.value}</span></div>`
    }).join('')
  }

  /** 判定期占位元素（P4/V2）：唯一允许在合格前出现的东西，文案取自 i18n。 */
  function pendingPlaceholder() {
    return `<span class="gate-pending"><span class="spinner-sm"></span>${esc(t(G.PENDING_KEY))}</span>`
  }

  // ── Mermaid 本地渲染（离线，浏览器端出图）─────────────────────────────
  // 库文件随页面一起部署（/assets/mermaid-11.16.0.min.js，取本仓库已锁定的
  // mermaid 11.16.0），渲染全在访客浏览器里完成，不需要任何在线渲染服务。
  const MERMAID_ASSET = 'assets/mermaid-11.16.0.min.js'

  // 品牌主题：mermaid 自带 base 主题 + themeVariables/themeCSS 就是官方的样式包
  // 机制（离线、随库版本匹配）。配色与页面一致（--brand #2563eb / 浅底深字），
  // 脑图走 cScale0..11 调色板，时序图/流程图/饼图各自补齐可读性参数。
  // 改这里的任何一项都要同时改 MERMAID_RENDER_FINGERPRINT，否则访客会继续
  // 命中旧样式缓存（已渲染 SVG 是按指纹缓存的）。
  const MERMAID_THEME = {
    theme: 'base',
    themeVariables: {
      fontFamily: '"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif',
      fontSize: '14px',
      textColor: '#1f2937',
      primaryColor: '#eff6ff', primaryTextColor: '#1e3a8a', primaryBorderColor: '#2563eb',
      secondaryColor: '#f8fafc', secondaryTextColor: '#334155', secondaryBorderColor: '#cbd5e1',
      tertiaryColor: '#ffffff', tertiaryTextColor: '#1f2937', tertiaryBorderColor: '#e5e7eb',
      mainBkg: '#eff6ff', nodeBorder: '#2563eb', lineColor: '#94a3b8',
      clusterBkg: '#f8fafc', clusterBorder: '#cbd5e1', edgeLabelBackground: '#ffffff',
      actorBkg: '#ffffff', actorBorder: '#2563eb', actorTextColor: '#1e3a8a', actorLineColor: '#cbd5e1',
      signalColor: '#334155', signalTextColor: '#1f2937',
      labelBoxBkgColor: '#eff6ff', labelBoxBorderColor: '#2563eb', labelTextColor: '#1e3a8a',
      loopTextColor: '#334155',
      noteBkgColor: '#fffbeb', noteBorderColor: '#fcd34d', noteTextColor: '#78350f',
      pie1: '#2563eb', pie2: '#0ea5e9', pie3: '#14b8a6', pie4: '#f59e0b', pie5: '#8b5cf6', pie6: '#ef4444',
      pieStrokeColor: '#ffffff', pieTitleTextSize: '15px', pieSectionTextSize: '13px', pieOuterStrokeColor: '#e5e7eb',
      // 脑图分支色取同色系浅色调：脑图里的文字固定是深色，饱和中色（如 #8b5cf6）
      // 会让深字对比度掉到 3.5 以下（实测 3.47），浅色调保留颜色区分且 ≥4.5。
      cScale0: '#bfdbfe', cScale1: '#bae6fd', cScale2: '#99f6e4', cScale3: '#fde68a',
      cScale4: '#ddd6fe', cScale5: '#fbcfe8', cScale6: '#bbf7d0', cScale7: '#fed7aa',
      cScale8: '#a5f3fc', cScale9: '#e9d5ff', cScale10: '#fef08a', cScale11: '#e2e8f0',
    },
    flowchart: { curve: 'basis', htmlLabels: true, padding: 14, nodeSpacing: 46, rankSpacing: 46, useMaxWidth: true },
    sequence: { useMaxWidth: true, wrap: true, diagramMarginX: 8, diagramMarginY: 8, actorMargin: 46, messageFontSize: 13, noteFontSize: 13, boxMargin: 8 },
    mindmap: { useMaxWidth: true, padding: 12, maxNodeWidth: 220 },
    // 圆角 + 轻投影 + 统一字重：默认主题的直角灰框看起来像草稿
    themeCSS: `
      .node rect, .node circle, .node ellipse, .node polygon, .node path { rx: 9px; ry: 9px; }
      .node rect, .node polygon, .node path { filter: drop-shadow(0 1px 2px rgba(15, 23, 42, .10)); }
      .node .label, .nodeLabel, .edgeLabel { font-weight: 500; }
      .edgeLabel rect { rx: 6px; ry: 6px; }
      .edgePath path { stroke-width: 1.5px; }
      .cluster rect { rx: 12px; ry: 12px; }
      .actor { rx: 9px; ry: 9px; filter: drop-shadow(0 1px 2px rgba(15, 23, 42, .10)); }
      .messageLine0, .messageLine1 { stroke-width: 1.4px; }
      .mindmap-node > rect, .mindmap-node > path, .mindmap-node > circle { rx: 11px; ry: 11px; filter: drop-shadow(0 1px 2px rgba(15, 23, 42, .10)); }
      .sectionTitle { font-weight: 600; }
    `,
  }

  let mermaidPromise = null
  /**
   * 本轮渲染器是否已加载失败（C8：失败后不再重试加载，避免每个图形块都重拉 3.4MB）。
   *
   * 重置粒度 = **每次新回答**（`send()` 开头清零），不是永久失败：资产是被临时
   * 挪走/网络抖动时，下一轮应该有机会重新加载成功（实测「永久失败」会让一次
   * 抖动影响整个会话）。同一轮内无论多少个 mermaid 块，都只尝试加载一次。
   */
  let mermaidLoadFailed = false
  let diagramSeq = 0
  let diagramObserver = null

  // 已渲染 SVG 的本地缓存：同一张图（同源码 + 同库版本 + 同渲染选项）只渲染一次，
  // 刷新/重进页面直接复用。localStorage 只有 ~5MB，因此限制条数并跳过超大图。
  const SVG_CACHE_PREFIX = 'dshagent_svg_'
  const SVG_CACHE_INDEX = 'dshagent_svg_index'
  const SVG_CACHE_MAX_ENTRIES = 40
  const SVG_CACHE_MAX_CHARS = 150 * 1024
  const MERMAID_RENDER_FINGERPRINT = `${MERMAID_ASSET}|strict|brand-v2`

  /** 供缓存键使用的短哈希（FNV-1a，纯前端同步计算，无需加密强度）。 */
  function hashKey(text) {
    let hash = 0x811c9dc5
    for (let i = 0; i < text.length; i++) {
      hash ^= text.charCodeAt(i)
      hash = Math.imul(hash, 0x01000193)
    }
    return (hash >>> 0).toString(36)
  }

  /** 读取某段 mermaid 源码已渲染好的 SVG（未缓存返回 null）。 */
  function svgCacheGet(source) {
    try { return localStorage.getItem(SVG_CACHE_PREFIX + hashKey(`${MERMAID_RENDER_FINGERPRINT}|${source}`)) } catch { return null }
  }

  /** 缓存渲染结果，按 LRU 索引淘汰最旧的条目；配额满/隐私模式时静默放弃。 */
  function svgCachePut(source, svg) {
    if (typeof svg !== 'string' || svg.length > SVG_CACHE_MAX_CHARS) return
    try {
      const key = SVG_CACHE_PREFIX + hashKey(`${MERMAID_RENDER_FINGERPRINT}|${source}`)
      localStorage.setItem(key, svg)
      const index = JSON.parse(localStorage.getItem(SVG_CACHE_INDEX) || '[]').filter(item => item !== key)
      index.push(key)
      while (index.length > SVG_CACHE_MAX_ENTRIES) {
        const stale = index.shift()
        if (stale) localStorage.removeItem(stale)
      }
      localStorage.setItem(SVG_CACHE_INDEX, JSON.stringify(index))
    } catch { /* 隐私模式或配额已满：跳过缓存，下次照常渲染 */ }
  }

  /** 懒加载 mermaid 库（同源相对路径，反代前缀自适应）；失败返回 null。 */
  function loadMermaid() {
    if (window.mermaid) return Promise.resolve(window.mermaid)
    // 本轮已失败过：直接拒绝，**不**再插入脚本标签。否则「Promise 置回 null →
    // 下一个块再试」会让单轮产生 N 次 404 请求风暴（实测 9 次请求 / 8 条控制台错误）。
    if (mermaidLoadFailed) {
      return Promise.reject(new Error('mermaid load failed earlier this turn'))
    }
    if (mermaidPromise) return mermaidPromise
    mermaidPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script')
      script.src = MERMAID_ASSET
      script.onload = () => {
        if (!window.mermaid) {
          mermaidLoadFailed = true
          mermaidPromise = null
          reject(new Error('mermaid not exposed'))
          return
        }
        // startOnLoad:false —— 由 renderDiagrams 精确控制渲染时机；
        // securityLevel:strict —— 模型输出一律当不可信内容，标签走净化。
        window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', ...MERMAID_THEME })
        resolve(window.mermaid)
      }
      script.onerror = () => {
        // 记住失败（本轮不再重试），并把已插入的 script 摘掉，避免残留
        mermaidLoadFailed = true
        mermaidPromise = null
        if (script.parentNode) script.parentNode.removeChild(script)
        reject(new Error('mermaid load failed'))
      }
      document.head.appendChild(script)
    })
    return mermaidPromise
  }

  /**
   * 把 root 内还没渲染的 mermaid 块转成 SVG。渲染结果按源码缓存（见
   * svgCacheGet/Put）：刷新时命中缓存直接贴回 SVG，既不再加载 3.5MB 的库，也不
   * 重新解析布局。流式回答期间保持占位（避免每个 delta 重排图），只在回答定稿
   * （done / 断流恢复）时渲染；恢复历史时只渲染进入视口的图。
   *
   * 门禁（P3/P5/P6）：节点状态走 `pending → loading → validating → passed/degraded`，
   * 超时或任一判据失败一律降级为可读文案——**容器里永远不会出现源码**。
   * @param root - 待渲染的容器
   * @param options.lazy - true 时（历史恢复）交给 IntersectionObserver 按需渲染
   */
  async function renderDiagrams(root, options = {}) {
    if (!root) return
    const nodes = [...root.querySelectorAll('.mermaid-src:not([data-rendered])')]
    if (nodes.length === 0) return
    const misses = []
    for (const node of nodes) {
      const source = blockSourceOf(node.dataset.blockKey)
      const cached = svgCacheGet(source)
      if (cached !== null) {
        node.setAttribute('data-rendered', '1')
        node.dataset.blockState = 'passed'
        node.innerHTML = cached
        node.classList.add('mermaid-done')
        reportGatePassed('mermaid', source, node.dataset.blockId || node.dataset.blockKey || '')
      } else {
        misses.push(node)
      }
    }
    if (misses.length === 0) return
    if (options.lazy && typeof IntersectionObserver === 'function') observeDiagrams(misses)
    else await renderMermaidNodes(misses)
  }

  /** 观察待渲染的图，进入视口（提前 300px）才真正渲染。 */
  function observeDiagrams(nodes) {
    if (!diagramObserver) {
      diagramObserver = new IntersectionObserver(entries => {
        const visible = entries.filter(entry => entry.isIntersecting).map(entry => entry.target)
        for (const node of visible) diagramObserver.unobserve(node)
        if (visible.length > 0) renderMermaidNodes(visible)
      }, { rootMargin: '300px 0px' })
    }
    for (const node of nodes) {
      node.setAttribute('data-rendered', '1')
      diagramObserver.observe(node)
    }
  }

  /**
   * 把一个 mermaid 节点推进到终态（P5/P6）。
   * 状态推进与判据都在这里：`pending → loading`（等库）→ `validating`（真机渲染 +
   * 几何判据）→ `passed`；任何一步失败/超时/违反预算都落到 `degraded`，且**不
   * 保留任何源码**。
   * @param node - `.mermaid-src` 容器
   * @param lib - 已就绪的 mermaid 实例（null 表示库不可用）
   */
  async function advanceMermaidNode(node, lib) {
    if (node.dataset.blockState === 'passed' || node.dataset.blockState === 'degraded') return
    const source = blockSourceOf(node.dataset.blockKey)
    const blockId = `mmd-${++diagramSeq}`
    const fail = reason => {
      node.dataset.blockState = G.GATE_STATES.degraded
      node.innerHTML = degradeElement('mermaid')
      reportGateFailure('mermaid', reason, source, blockId)
    }
    if (lib === null) { fail(G.GATE_REASONS.libraryUnavailable); return }
    // P7（v3.2 并行语义）：各块判定并行推进，只用单块上限 gate.blockTimeoutMs，
    // 不用「整条回答总配额」——串行配额会让第 2 块因前一块耗时而必然被降级。
    node.dataset.blockState = G.GATE_STATES.validating
    const started = Date.now()
    let verdict
    let svg = null
    try {
      const outcome = await withTimeout(lib.render(`dsh-mmd-${blockId}`, source), GATE_BLOCK_TIMEOUT_MS)
      svg = outcome && typeof outcome.svg === 'string' ? outcome.svg : null
      const metrics = svg === null ? null : measureSvg(svg)
      if (metrics === null) verdict = { ok: false, reason: G.GATE_REASONS.renderEmpty }
      else verdict = G.checkRendered('mermaid', metrics, { maxAspectRatio: G.DEFAULT_MAX_ASPECT_RATIO })
    } catch (error) {
      // 超时与语法错误都归入 parse-error / timeout（O2 枚举内），二者对访客等价
      verdict = { ok: false, reason: error && error.gateTimeout ? G.GATE_REASONS.timeout : G.GATE_REASONS.parseError }
    }
    void started
    if (!verdict.ok || svg === null) { fail(verdict.reason || G.GATE_REASONS.renderEmpty); return }
    settledGates.add(node.dataset.blockKey || '')
    node.dataset.blockState = G.GATE_STATES.passed
    node.innerHTML = svg
    node.classList.add('mermaid-done')
    svgCachePut(source, svg)
    reportGatePassed('mermaid', source, node.dataset.blockId || node.dataset.blockKey || '')
  }

  /**
   * 真机测量一段 SVG 的几何（C1/C5 判据的输入）。
   * 解析后挂到离屏容器里量 bbox——只有真机布局才给得出真实几何。
   * @param svg - 渲染产出的 SVG 字符串
   * @returns 判据输入；无法解析时返回 null
   */
  function measureSvg(svg) {
    try {
      const box = document.createElement('div')
      box.style.cssText = 'position:absolute;left:-99999px;top:0;width:1200px;visibility:hidden'
      box.innerHTML = svg
      document.body.appendChild(box)
      try {
        const el = box.querySelector('svg')
        if (!el) return null
        const rect = el.getBoundingClientRect()
        const geometryTags = ['path', 'rect', 'circle', 'ellipse', 'polygon', 'polyline', 'line', 'text', 'foreignObject']
        const childCount = el.querySelectorAll(geometryTags.join(',')).length
        return {
          childNodeCount: childCount,
          hasGeometry: childCount > 0,
          viewBox: el.getAttribute('viewBox'),
          width: Number(el.getAttribute('width')) || rect.width,
          height: Number(el.getAttribute('height')) || rect.height,
          bboxWidth: rect.width,
          bboxHeight: rect.height,
        }
      } finally { box.remove() }
    } catch { return null }
  }

  /**
   * 给一个 Promise 套上超时（`G.blockTimeoutMs`）。超时会标记 `gateTimeout`，
   * 让调用方把 reason 归到 `timeout` 而不是 `parse-error`。
   * @param promise - 待等待的 Promise
   * @param ms - 最长等待毫秒
   * @returns 原 Promise 的解析值；超时则 reject
   */
  function withTimeout(promise, ms) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        const error = new Error('gate timeout')
        error.gateTimeout = true
        reject(error)
      }, ms)
      Promise.resolve(promise).then(
        value => { clearTimeout(timer); resolve(value) },
        error => { clearTimeout(timer); reject(error) },
      )
    })
  }

  /**
   * 真正调用 mermaid 渲染这些节点。
   * 库不可用时不重试加载（C8：避免每次回答重复拉 3.4MB），直接把该批块降级。
   * @param nodes - 待渲染的 `.mermaid-src` 容器
   */
  async function renderMermaidNodes(nodes) {
    const pending = nodes.filter(node => !node.classList.contains('mermaid-done'))
    if (pending.length === 0) return
    for (const node of pending) node.dataset.blockState = G.GATE_STATES.loading
    let lib = null
    try {
      lib = await withTimeout(loadMermaid(), GATE_LIBRARY_LOAD_TIMEOUT_MS)
    } catch { lib = null /* 库缺失/超时：该类型块一律降级，不重试加载 */ }
    for (const node of pending) await advanceMermaidNode(node, lib)
  }

  /**
   * 断流/离开页面时把仍在判定期或尚未渲染的块按 P6/P9 降级。
   * 已 `passed` 的块保持显示，不回改（REP5）。
   * @param root - 容器（默认整个聊天区）
   */
  function degradePendingGates(root) {
    const scope = root || chatEl
    if (!scope) return
    for (const node of scope.querySelectorAll('.mermaid-src')) {
      const state = node.dataset.blockState
      if (state === G.GATE_STATES.passed || state === G.GATE_STATES.degraded
        || node.classList.contains('mermaid-done')) continue
      node.dataset.blockState = G.GATE_STATES.degraded
      node.innerHTML = degradeElement('mermaid')
      reportGateFailure('mermaid', G.GATE_REASONS.timeout, blockSourceOf(node.dataset.blockKey), `stale-${node.dataset.blockKey || 'anon'}`)
    }
    // 图片：必须覆盖 `validating`（真机 decode 跨网络，很可能在本窗口内未回来）。
    // 只匹配 `pending` 会漏掉它——实测该漏判让「done → 结算」拖到 672ms，越过 600ms 预算。
    for (const node of scope.querySelectorAll('.kb-image')) {
      const state = node.dataset.blockState
      if (state === G.GATE_STATES.passed || state === G.GATE_STATES.degraded) continue
      node.dataset.blockState = G.GATE_STATES.degraded
      const key = node.dataset.blockKey || ''
      node.innerHTML = degradeElement('image')
      const caption = imageCaptions.get(key)
      // REP3①：图注是语义等价正文，降级时保留
      if (caption) {
        const cap = document.createElement('figcaption')
        cap.textContent = caption
        node.appendChild(cap)
      }
      reportGateFailure('image', G.GATE_REASONS.timeout, blockSourceOf(key), `stale-${key || 'anon'}`)
    }
    // 预裁决占位（block-open 后一直没等到 block，或本地扫描未结算）：
    // 到窗口仍未终态一律按**自己的类型**降级——不能一律落到 html 键，那会让
    // mermaid 块显示「这部分内容暂时无法显示」而不是示意图/D3 对应文案。
    for (const node of scope.querySelectorAll('.gate-block, .chart')) {
      const state = node.dataset.blockState
      if (state === G.GATE_STATES.passed || state === G.GATE_STATES.degraded) continue
      const type = node.dataset.blockType || (node.classList.contains('chart') ? 'chart' : 'html')
      node.dataset.blockState = G.GATE_STATES.degraded
      node.innerHTML = degradeElement(type)
    }
  }


  // ── 图片阅读器（点击图片/图表放大查看）───────────────────────────────
  // 沿用团队既有实现（Readmdvue 浏览器插件 image-modal）：深色毛玻璃底 + 克隆
  // 内容居中 + 背景点击/ESC 关闭；访客场景再补缩放、平移、双指捏合与下载。
  const VIEWER_MIN = 0.5
  const VIEWER_MAX = 8
  const viewer = { el: null, stage: null, scale: 1, tx: 0, ty: 0, src: '', raster: false, pointers: new Map() }

  /** 按当前缩放/平移量刷新阅读器画面与比例提示。 */
  function applyViewerTransform() {
    if (!viewer.stage) return
    viewer.stage.style.transform = `translate(${viewer.tx}px, ${viewer.ty}px) scale(${viewer.scale})`
    const badge = viewer.el && viewer.el.querySelector('.viewer-scale')
    if (badge) badge.textContent = `${Math.round(viewer.scale * 100)}%`
  }

  /**
   * 以屏幕上某点为锚点缩放（该点在缩放前后保持不动）。锚点默认取视口中心。
   * @param factor - 相对倍率（>1 放大，<1 缩小）
   */
  function zoomViewer(factor, px, py) {
    if (!viewer.stage) return
    const next = Math.min(VIEWER_MAX, Math.max(VIEWER_MIN, viewer.scale * factor))
    if (next === viewer.scale) return
    const k = next / viewer.scale
    const rect = viewer.stage.getBoundingClientRect()
    const cx = rect.left + rect.width / 2
    const cy = rect.top + rect.height / 2
    const ox = px === undefined ? cx : px
    const oy = py === undefined ? cy : py
    // 中心点平移量：指针到中心的距离按 (1-k) 补偿，保证锚点像素不动
    viewer.tx += (1 - k) * (ox - cx)
    viewer.ty += (1 - k) * (oy - cy)
    viewer.scale = next
    applyViewerTransform()
  }

  /** 复位到 100% 且居中。 */
  function resetViewer() {
    viewer.scale = 1
    viewer.tx = 0
    viewer.ty = 0
    applyViewerTransform()
  }

  /** 关闭阅读器并解绑全局键盘监听。 */
  function closeViewer() {
    const el = viewer.el
    if (!el) return
    el.classList.remove('show')
    document.removeEventListener('keydown', viewer.onKey)
    document.body.style.overflow = viewer.prevOverflow || ''
    viewer.el = null
    viewer.stage = null
    viewer.pointers.clear()
    setTimeout(() => el.remove(), 250)
  }

  /**
   * 打开阅读器。图片走 <img>（可下载/新窗口打开）；已渲染的 mermaid 图表
   * 直接克隆 SVG 节点，缩放到原尺寸查看。
   * @param node - 聊天区里被点击的 <img> 或图表容器
   */
  function openViewer(node) {
    if (viewer.el) { closeViewer(); return } // 再点一次即切换关闭
    const isRaster = node.tagName === 'IMG'
    const source = isRaster ? node : node.querySelector('svg')
    if (!source) return

    const el = document.createElement('div')
    el.className = 'viewer'
    const stage = document.createElement('div')
    stage.className = 'viewer-stage'
    let content
    if (isRaster) {
      content = document.createElement('img')
      content.src = node.currentSrc || node.src
      content.alt = node.alt || ''
      content.draggable = false
      // 取不到的图在深色底上只会留一个白点占位：直接给出可读提示
      content.addEventListener('error', () => {
        stage.classList.add('broken')
        stage.setAttribute('data-fallback', `${t('imageUnavailable')}\n${viewer.src}`)
      })
      viewer.src = content.src
    } else {
      content = source.cloneNode(true)
      // 只带 viewBox 的 SVG 没有固有尺寸，放进阅读器会塌成 12x12 的小白点
      // （实测：内联 738x331 → 阅读器 12x12）。这里用 viewBox 尺寸补回固有宽高，
      // 再由 CSS 的 max-width/max-height 等比缩到视口内。
      const box = (content.getAttribute('viewBox') || '').trim().split(/[\s,]+/).filter(Boolean).map(Number)
      if (box.length === 4 && box[2] > 0 && box[3] > 0) {
        content.setAttribute('width', String(box[2]))
        content.setAttribute('height', String(box[3]))
      } else {
        const rect = source.getBoundingClientRect()
        content.setAttribute('width', String(Math.max(1, Math.round(rect.width))))
        content.setAttribute('height', String(Math.max(1, Math.round(rect.height))))
      }
      // 去掉 mermaid 自带的 max-width 内联样式（其它内联样式保留），尺寸交给阅读器 CSS
      const inlineStyle = content.getAttribute('style') || ''
      content.setAttribute('style', inlineStyle.replace(/max-width\s*:[^;]+;?/i, ''))
      content.setAttribute('preserveAspectRatio', 'xMidYMid meet')
      viewer.src = ''
    }
    stage.appendChild(content)
    el.appendChild(stage)

    const bar = document.createElement('div')
    bar.className = 'viewer-bar'
    const buttons = [
      { glyph: '＋', label: t('viewerZoomIn'), act: () => zoomViewer(1.25) },
      { glyph: '－', label: t('viewerZoomOut'), act: () => zoomViewer(0.8) },
      { glyph: '⟲', label: t('viewerReset'), act: () => resetViewer() },
    ]
    if (viewer.src) {
      buttons.push({ glyph: '⤢', label: t('viewerOpenTab'), act: () => window.open(viewer.src, '_blank', 'noopener') })
      buttons.push({ glyph: '⤓', label: t('viewerDownload'), act: () => downloadViewerImage() })
    }
    buttons.push({ glyph: '✕', label: t('viewerClose'), act: () => closeViewer() })
    for (const item of buttons) {
      const button = document.createElement('button')
      button.type = 'button'
      button.textContent = item.glyph
      button.title = item.label
      button.setAttribute('aria-label', item.label)
      button.addEventListener('click', event => { event.stopPropagation(); item.act() })
      bar.appendChild(button)
    }
    el.appendChild(bar)

    const badge = document.createElement('div')
    badge.className = 'viewer-scale'
    el.appendChild(badge)

    el.addEventListener('click', event => { if (event.target === el) closeViewer() }) // 点背景关闭
    // 滚轮缩放（锚点跟随指针）：passive:false 才能 preventDefault 阻止页面滚动
    el.addEventListener('wheel', event => {
      event.preventDefault()
      zoomViewer(Math.exp(-event.deltaY * 0.0015), event.clientX, event.clientY)
    }, { passive: false })
    // 双击：在 100% 与 200% 之间切换
    stage.addEventListener('dblclick', event => {
      event.preventDefault()
      if (viewer.scale > 1) resetViewer()
      else zoomViewer(2, event.clientX, event.clientY)
    })
    // 指针事件统一处理鼠标拖拽平移与触摸双指捏合
    el.addEventListener('pointerdown', onViewerPointerDown)
    el.addEventListener('pointermove', onViewerPointerMove)
    el.addEventListener('pointerup', onViewerPointerUp)
    el.addEventListener('pointercancel', onViewerPointerUp)
    viewer.onKey = event => {
      if (event.key === 'Escape') closeViewer()
      else if (event.key === '+' || event.key === '=') zoomViewer(1.25)
      else if (event.key === '-' || event.key === '_') zoomViewer(0.8)
      else if (event.key === '0') resetViewer()
    }
    document.addEventListener('keydown', viewer.onKey)

    viewer.el = el
    viewer.stage = stage
    viewer.scale = 1
    viewer.tx = 0
    viewer.ty = 0
    viewer.prevOverflow = document.body.style.overflow
    document.body.style.overflow = 'hidden' // 阅读时锁住背景滚动
    applyViewerTransform()
    document.body.appendChild(el)
    requestAnimationFrame(() => el.classList.add('show'))
  }

  /** 阅读器里的图片下载（沿用原始文件名）。 */
  function downloadViewerImage() {
    if (!viewer.src) return
    const link = document.createElement('a')
    link.href = viewer.src
    link.download = decodeURIComponent(viewer.src.split('/').pop() || 'image')
    document.body.appendChild(link)
    link.click()
    link.remove()
  }

  /** 拖拽平移 / 双指捏合：全部用指针事件，桌面与移动端同一套代码。 */
  function onViewerPointerDown(event) {
    if (!viewer.stage) return
    viewer.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY })
    viewer.stage.classList.add('dragging')
  }

  function onViewerPointerMove(event) {
    const tracked = viewer.pointers.get(event.pointerId)
    if (!tracked || !viewer.stage) return
    const points = [...viewer.pointers.values()]
    if (viewer.pointers.size === 1) {
      // 单指/鼠标：平移
      viewer.tx += event.clientX - tracked.x
      viewer.ty += event.clientY - tracked.y
      tracked.x = event.clientX
      tracked.y = event.clientY
      applyViewerTransform()
      return
    }
    // 双指：按下两指间距的比例缩放，锚点取两指中点
    const other = points.find(p => p !== tracked)
    const previous = Math.hypot(tracked.x - other.x, tracked.y - other.y)
    tracked.x = event.clientX
    tracked.y = event.clientY
    const current = Math.hypot(tracked.x - other.x, tracked.y - other.y)
    if (previous > 0 && current > 0) {
      zoomViewer(current / previous, (tracked.x + other.x) / 2, (tracked.y + other.y) / 2)
    }
  }

  function onViewerPointerUp(event) {
    viewer.pointers.delete(event.pointerId)
    if (viewer.stage && viewer.pointers.size === 0) viewer.stage.classList.remove('dragging')
  }

  // 事件委托：聊天区里点图片或已渲染的图表 → 打开阅读器
  chatEl.addEventListener('click', event => {
    const target = event.target
    if (!(target instanceof Element)) return
    const image = target.closest('.bubble img')
    if (image) { event.preventDefault(); openViewer(image); return }
    const diagram = target.closest('.bubble .mermaid-src.mermaid-done')
    if (diagram) { event.preventDefault(); openViewer(diagram) }
  })

  // 图片加载失败（源站已删图 / 网络不通）：降级为文字提示，避免破图图标
  chatEl.addEventListener('error', event => {
    const target = event.target
    if (!(target instanceof HTMLImageElement)) return
    const figure = target.closest('.kb-image')
    if (!figure) return
    figure.classList.add('broken')
    figure.setAttribute('data-fallback', t('imageUnavailable'))
  }, true)

  function addMessage(role, html, sources) {
    if (welcomeEl) welcomeEl.hidden = true
    const restoring = document.getElementById('restoring')
    if (restoring) restoring.hidden = true
    const msg = document.createElement('div')
    msg.className = `msg ${role}`
    const avatar = document.createElement('div')
    avatar.className = 'avatar'
    avatar.textContent = role === 'user' ? t('userLabel') : t('aiLabel')
    const bubble = document.createElement('div')
    bubble.className = 'bubble'
    bubble.innerHTML = html
    msg.appendChild(avatar)
    msg.appendChild(bubble)
    if (sources && sources.length) {
      const src = document.createElement('div')
      src.className = 'sources'
      src.innerHTML = sources.map(s => `<span>📄 ${esc(s)}</span>`).join('')
      bubble.appendChild(src)
    }
    chatEl.appendChild(msg)
    chatEl.scrollTop = chatEl.scrollHeight
    return msg
  }

  async function ensureSession() {
    if (sessionId) return sessionId
    setStatus('connecting')
    const res = await fetch(`${API_BASE}/api/guest/session`, { method: 'POST' })
    if (!res.ok) throw new Error('create session failed')
    const data = await res.json()
    saveSession(data.sessionId)
    setStatus('online')
    return sessionId
  }

  /** Restore a previous conversation (same browser, after refresh) from the server. */
  async function restoreHistory() {
    if (!sessionId) return
    // Show a restoring animation while history loads so the visitor is not
    // staring at a blank chat during the fetch.
    const restoringEl = document.getElementById('restoring')
    welcomeEl.hidden = true
    restoringEl.hidden = false
    try {
      const res = await fetch(`${API_BASE}/api/guest/history?sessionId=${encodeURIComponent(sessionId)}`)
      if (!res.ok) {
        // 400 (malformed) and 404 (session gone on the server) both mean the
        // stored session id is unusable: drop it and start a fresh one. Only
        // genuine server/network errors keep the id so chat can retry.
        if (res.status === 400 || res.status === 404) {
          localStorage.removeItem('dshagent_session')
          sessionId = null
        }
        return
      }
      const data = await res.json()
      const messages = data.messages || []
      if (messages.length === 0) return
      setStatus('online')
      for (const m of messages) {
        if (m.role === 'assistant') {
          const host = addMessage('assistant', renderMarkdown(m.text))
          // 历史重放也要吃下 `blocks`：服务端 /history 一直带着它（含 sourceB64 与
          // 终态 decision），但旧实现只用了 `m.text`，导致刷新/重开后图形块整体消失
          // （当轮送达正常、唯独重放丢块）。这里按条复位台账后复用与 `done` 帧
          // 完全相同的 `adoptDoneBlocks` + `refreshBlockSlots`，保证「历史重放与
          // 当轮送达同一判定」（E4），不新增第二套渲染路径。
          blockSlots.clear()
          blockOrder.length = 0
          sawBlockEvent = true
          if (Array.isArray(m.blocks) && m.blocks.length > 0) {
            adoptDoneBlocks(m)
            refreshBlockSlots(host.querySelector('.bubble'))
          }
        } else {
          addMessage('user', renderMarkdown(m.text))
        }
      }
      // 历史重放：与当轮送达同一判定（E4）——图形块一律先占位，再在真机判定
      await finalizeHistoryGates(chatEl)
    } catch { /* offline / server restarted: keep session id, chat will resume it */ }
    finally {
      // addMessage removes welcome; if nothing was restored, show the
      // welcome hero again.
      restoringEl.hidden = true
      const hasMessages = chatEl.querySelector('.msg') !== null
      if (!hasMessages) welcomeEl.hidden = false
    }
  }

  /**
   * Parse one SSE stream from a fetch Response, calling handlers per event.
   * Watchdog: the free ngrok tunnel sometimes opens the SSE response but then
   * stops forwarding frames (no data, no FIN) — a blocked reader.read() would
   * otherwise hang forever and the spinner would spin indefinitely. Each read
   * races a 30s timer; a stall throws and send() recovers the persisted reply
   * from history.
   * @param res - fetch Response whose body is an SSE stream.
   * @param onEvent - per-frame handler `(event, data)`, awaited so frame order holds.
   */
  async function consumeSse(res, onEvent) {
    if (!res.body) throw new Error('no stream body')
    const reader = res.body.getReader()
    const decoder = new TextDecoder()
    // Tunnel stall detection: ngrok's free tier sometimes opens the SSE
    // response then never delivers another frame (no data, no FIN). A normal
    // turn starts producing frames within ~10s (reasoning is filtered out, so
    // the first visible frame may lag a few seconds behind the model start).
    // If no frame arrives within 25s of the previous one the tunnel is dead.
    const stallMs = 25000
    let buffer = ''
    while (true) {
      // Race the read against a stall timer: ngrok (free tunnel) occasionally
      // holds the connection open without delivering frames, so read() alone
      // never resolves. Throw so send() can fall back to history recovery.
      let chunk
      try {
        chunk = await Promise.race([
          reader.read(),
          new Promise((_, reject) => setTimeout(() => reject(new Error('stream stalled')), stallMs)),
        ])
      } catch (err) {
        // Do NOT await reader.cancel(): on a tunnel that stopped forwarding
        // frames, cancel() itself can hang. Fire it and surface the stall.
        reader.cancel().catch(() => { /* best-effort */ })
        throw err
      }
      if (chunk.done) break
      buffer += decoder.decode(chunk.value, { stream: true })
      // SSE frames are separated by a blank line
      let idx
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const frame = buffer.slice(0, idx)
        buffer = buffer.slice(idx + 2)
        let event = 'message'
        let data = ''
        for (const line of frame.split('\n')) {
          if (line.startsWith('event:')) event = line.slice(6).trim()
          else if (line.startsWith('data:')) data += line.slice(5).trim()
        }
        if (data) {
          let parsed
          try { parsed = JSON.parse(data) } catch { parsed = { raw: data } }
          // 逐个 await：事件顺序必须与到达顺序一致（sources 要先于 done 生效）
          await onEvent(event, parsed)
        }
      }
    }
  }

  /**
   * Recover a reply after a dropped stream: poll the server history until the
   * assistant answer following our message appears (the server keeps running
   * the turn even when the SSE connection dies). Gives up after ~20s so a
   * genuinely failed request surfaces as an error instead of an endless wait.
   * @param text - the exact user message whose reply we are waiting for.
   */
  async function recoverReply(text) {
    const deadline = Date.now() + 20000
    let first = true
    while (Date.now() < deadline) {
      if (!first) await new Promise(r => setTimeout(r, 1200))
      first = false
      try {
        const res = await fetch(`${API_BASE}/api/guest/history?sessionId=${encodeURIComponent(sessionId)}`)
        if (!res.ok) continue
        const data = await res.json()
        const messages = data.messages || []
        // Find the newest assistant message that answers this exact question
        // (the last matching user message, then the assistant text after it).
        let found = null
        for (let i = messages.length - 1; i >= 0; i--) {
          if (messages[i].role === 'user' && messages[i].text === text) {
            found = i
            break
          }
        }
        if (found !== null) {
          const next = messages[found + 1]
          if (next && next.role === 'assistant' && next.text) {
            return { text: next.text, sources: next.sources }
          }
        }
      } catch { /* server restarting / offline: keep polling */ }
    }
    return null
  }

  /**
   * 流式渲染入口：正文照常逐字上屏，受控图形块换成判定期占位。
   *
   * 流式期唯一允许出现的图形块形态就是 `data-block-state="pending"` 占位（P4/V1/V2）
   * ——旧实现把半截围栏当代码块贴出来，访客在第 38 个 delta 就看到了源码。真机
   * 校验与渲染不在这里做（那是 `renderDiagrams` 在 `done` 之后的职责）。
   *
   * 未闭合的块同样只出占位：`renderMarkdown` 的围栏分支对「已闭合」与「未闭合」
   * 都产出 `data-block-state="pending"`，块体源码只进内存台账，不进 DOM。
   * @param src - 到本帧为止累积的回答正文
   * @param options.final - true 表示回答已定稿（本地已有 reply），未闭合块也须占位
   * @returns 可直接写入 `bubble.innerHTML` 的 HTML
   */
  function renderStreamMarkdown(src, options = {}) {
    void options
    // 图形块的占位由 renderMarkdown 的围栏分支统一产出（单一实现）。
    // 返回值只含占位；块一旦闭合，`startClosedGates` 会立刻开判。
    return renderMarkdown(src)
  }

  /**
   * 启动「已闭合但尚未开判」的图形块（P5：块闭合后即进入 validating）。
   *
   * 为什么必须在流式期就启动、而不能全堆到 `done`：实测单轮首帧 11.03s、`done`
   * 19.14s，块闭合后仍有 **6.6s** 生成窗口。把判定推迟到 `done`，等于把这 6.6s
   * 白扔，让 mermaid 渲染与图片 `decode()` 全部挤进 `done` 后 600ms 的收尾窗口——
   * 图片判据跨网络，几乎必然被降级（CF-1 要消灭的正是这种"本来能显示的图变成
   * 文字"）。在这里开判，收尾窗口才只是安全网。
   *
   * 不 await：文字打字机不受影响；各块状态机（`pending` 才处理、进入终态即跳过）
   * 保证同一块只被启动一次（P8/REP5）。
   * @param root - 气泡容器
   */
  function startClosedGates(root) {
    if (!root) return
    try {
      settleGatePlaceholders(root)
    } catch { /* 门禁启动异常不得影响文字上屏（C8） */ }
  }

  /**
   * 把流式 HTML 写进气泡，同时**保住已结算的图形块**。
   *
   * 打字机每帧都要重渲染整段正文（`innerHTML` 赋值），这会顺手把还没回图的
   * `<img>`、正在渲染的 mermaid 容器一起销毁——本块已经用掉的生成窗口白费，
   * 图片请求被反复重启，`done` 时又从头开判（实测：图片直到 done+9ms 才进入
   * validating，而它早在 1.2s 就该开始）。这里在重渲染前后搬运终态元素：
   * 状态与元素本身都保留（同一个 `<img>` 节点重新挂载不会取消已发出的请求）。
   * @param root - 气泡容器
   * @param html - 本帧的完整 HTML
   */
  function paintStream(root, html) {
    if (!root) return
    // 1) 摘下已进入 validating/passed/degraded 的块**真节点**（pending 占位无状态可保）。
    //    必须是真节点而非 clone：`<img>` 的请求与 load/error 监听都挂在节点上，
    //    clone 会造出一个新元素——在飞的请求与其回调一起丢失，块等于从头再判一次。
    const carried = new Map()
    for (const node of root.querySelectorAll('[data-block-key]')) {
      const state = node.dataset.blockState
      if (state === G.GATE_STATES.pending || !state) continue
      carried.set(node.dataset.blockKey, node)
    }
    // 口径 B 的块槽位容器必须整体搬走：它由 block 事件驱动，不能被正文重渲染抹掉。
    // 直接复用**同一个节点**（先摘下来，稍后挂回）——`cloneNode(false)` + 移动子节点
    // 会丢掉 `:scope > .gate-blocks` 的定位假设，且在 done 重渲染时让已 passed 的块
    // 凭空消失（实测 kb-image:passed 在 done 帧后不见了）。
    const carriedHost = root.querySelector(':scope > .gate-blocks')
    if (carriedHost) carriedHost.remove()
    root.innerHTML = html
    // 2) 用真节点替换同名占位：请求不取消、监听不丢、状态延续（REP5 不回改已上屏内容）
    for (const placeholder of root.querySelectorAll('[data-block-key]')) {
      const live = carried.get(placeholder.dataset.blockKey)
      if (!live) continue
      placeholder.replaceWith(live)
    }
    // 3) 恢复块槽位容器（内容原样，含在飞节点）
    if (carriedHost) {
      root.appendChild(carriedHost)
    } else if (blockOrder.length > 0) {
      // 正文重渲染把 host 抹掉（例如 block 事件先到、delta 后到）：重建并渲染槽位
      refreshBlockSlots(root)
    }
  }

  /**
   * 四类图形块的唯一入口：产出「占位」或「立即终态」元素。
   *
   * 为什么要有这一层：只走这条路径，才能保证没有任何图形块能绕过判据直接渲染
   * （旧实现里 `renderImageBlock` 会立刻写 `<img src>`，图片请求先于任何判定发出）。
   * mermaid 需要真机渲染与几何判据，统一留给 `done` 之后的 renderDiagrams；chart /
   * image / html 的判据是同步或单事件可达的，这里当场给结论。
   * @param type - 四类块之一（已规范化）
   * @param info - 围栏语言后的附加关键字（如 mindmap）
   * @param raw - 块体源码
   * @returns 元素 HTML
   */
  function gateBlockHtml(type, info, raw) {
    return gatePlaceholderHtml({
      blockId: `inline-${G.shortDigest(raw)}`,
      blockType: type,
      info,
      lines: raw.split('\n'),
      closed: true,
    })
  }

  /**
   * 为一个受控块产出占位/终态元素。
   * 已闭合的块可以就地判定（mermaid 渲染要等 `done` 之后的 `renderDiagrams`，其余
   * 三类判据是同步的，当场就能给结论）；未闭合的块只有占位。
   * @param block - 块描述 `{ blockType, info, lines, closed }`
   * @returns 元素 HTML
   */
  function gatePlaceholderHtml(block) {
    const type = block.blockType
    const source = block.lines.join('\n')
    if (!block.closed) {
      return `<div class="gate-block" data-block-type="${esc(type)}" data-block-state="pending">${pendingPlaceholder()}</div>`
    }
    if (type === 'mermaid') {
      const head = source.trimStart()
      const src = block.info && !head.startsWith(block.info) ? `${block.info}\n${source}` : source
      return `<div class="mermaid-src" data-block-state="pending" data-block-key="${esc(localGateKey('mermaid', src, block))}">${pendingPlaceholder()}</div>`
    }
    if (type === 'chart') {
      // 判据是同步的，但渲染仍统一延到结算阶段，保证「占位 → 终态」只发生一次（REP2/REP5）
      const key = localGateKey('chart', source, block)
      return `<div class="chart" data-block-state="pending" data-block-key="${esc(key)}">${pendingPlaceholder()}</div>`
    }
    if (type === 'image') {
      const first = (block.lines[0] || '').trim().replace(/^`+|`+$/g, '')
      if (!G.checkImagePath(first).ok) return evidenceHint('image', 'image-path-invalid', source)
      const caption = block.lines.slice(1).join(' ').trim()
      // 真机取图要等解码判据（naturalWidth）阶段才发起（C4/IMG2）；路径与图注放
      // 内存台账，DOM 上只留短键
      const key = localGateKey('image', first, block)
      imageCaptions.set(key, caption)
      return `<figure class="kb-image" data-block-state="pending" data-block-key="${esc(key)}">${pendingPlaceholder()}</figure>`
    }
    const checked = G.checkHtmlBlock(source, GATE_MAX_BLOCK_BYTES)
    if (!checked.ok) return evidenceHint('html', checked.reason, source)
    return `<div class="gate-block" data-block-type="html" data-block-state="pending" data-block-key="${esc(localGateKey('html', source, block))}">${pendingPlaceholder()}</div>`
  }

  /**
   * 把已上屏的占位推进到终态（`done` / 断流恢复之后调用）。
   * 三类同步判据当场给结论；html 交给沙箱回传高度后再判定；图片靠真机解码
   * （naturalWidth>0，C4）——布局尺寸恒有效，不可作判据。
   * @param root - 气泡容器
   */
  function settleGatePlaceholders(root) {
    if (!root) return
    // chart：同步判据，通过则渲染为条形图；不通过则可读降级（C2/D3）
    for (const node of [...root.querySelectorAll('.chart[data-block-state="pending"]')]) {
      const source = blockSourceOf(node.dataset.blockKey)
      const checked = G.checkChartData(source)
      settledGates.add(node.dataset.blockKey || '')
      if (!checked.ok) {
        node.dataset.blockState = G.GATE_STATES.degraded
        node.innerHTML = degradeElement('chart')
        reportGateFailure('chart', checked.reason, source, `chart-${G.shortDigest(source)}`)
        continue
      }
      node.dataset.blockState = G.GATE_STATES.passed
      node.innerHTML = renderChartRows(checked.rows)
      reportGatePassed('chart', source, node.dataset.blockId || node.dataset.blockKey || '')
    }
    // html：同步判据（非空白 + 字节上限），通过才建沙箱 iframe（C3）。
    // 只处理 html 类型的占位：`.gate-block` 也是「预裁决占位」的通用类名，
    // 若不按 data-block-type 过滤，mermaid 的预占位会被这里用 html 降级文案判掉
    // （实测：块显示「这部分内容暂时无法显示」而不是示意图文案）。
    for (const node of [...root.querySelectorAll('.gate-block')]) {
      if (node.dataset.blockState !== 'pending') continue
      const nodeType = node.dataset.blockType || 'html'
      if (nodeType !== 'html') continue
      const source = blockSourceOf(node.dataset.blockKey)
      const checked = G.checkHtmlBlock(source, GATE_MAX_BLOCK_BYTES)
      settledGates.add(node.dataset.blockKey || '')
      if (!checked.ok) {
        node.dataset.blockState = G.GATE_STATES.degraded
        node.innerHTML = degradeElement('html')
        reportGateFailure('html', checked.reason, source, `html-${G.shortDigest(source)}`)
        continue
      }
      node.dataset.blockState = G.GATE_STATES.passed
      node.innerHTML = renderHtmlBlock(source)
      reportGatePassed('html', source, node.dataset.blockId || node.dataset.blockKey || '')
    }
    settleGateImages(root)
    settleGateMermaid(root)
  }

  /** 图片占位 → 真机解码判据（C4）：naturalWidth>0 才算通过，否则降级。 */
  function settleGateImages(root) {
    for (const figure of [...root.querySelectorAll('.kb-image[data-block-state="pending"]')]) {
      const key = figure.dataset.blockKey || ''
      const path = blockSourceOf(key)
      const caption = imageCaptions.get(key) || ''
      const src = G.toImageSrc(path, API_BASE)
      if (src === null) {
        figure.dataset.blockState = G.GATE_STATES.degraded
        figure.innerHTML = degradeElement('image')
        reportGateFailure('image', 'image-path-invalid', path, `img-${G.shortDigest(path)}`)
        continue
      }
      figure.dataset.blockState = G.GATE_STATES.validating
      const img = document.createElement('img')
      // 布局尺寸只用于预留空间；判据一律走 naturalWidth（C4）
      img.width = 1000
      img.height = 560
      img.alt = caption
      img.decoding = 'async'

      const finish = ok => {
        if (figure.dataset.blockState !== G.GATE_STATES.validating) return
        settledGates.add(key)
        if (ok) {
          figure.dataset.blockState = G.GATE_STATES.passed
          reportGatePassed('image', path, figure.dataset.blockId || key || '')
          return
        }
        figure.dataset.blockState = G.GATE_STATES.degraded
        // REP3①：图注是语义等价的正文，降级时保留它，只去掉图形本身
        figure.innerHTML = degradeElement('image')
        if (caption) {
          const cap = document.createElement('figcaption')
          cap.textContent = caption
          figure.appendChild(cap)
        }
        reportGateFailure('image', 'image-decode-failed', path, `img-${G.shortDigest(path)}`)
      }

      /**
       * 真机判据入口（C4）：优先 `decode()`（它把「解码失败」与「尚未解码」分开），
       * 拿不到 decode 就退回 load 事件后的 naturalWidth。两者都以 `naturalWidth>0`
       * 为通过条件，**绝不用布局尺寸**。
       */
      const judge = async () => {
        try {
          if (typeof img.decode === 'function') await img.decode()
        } catch { /* 解码失败：交给下面的判据统一降级 */ }
        if (figure.dataset.blockState !== G.GATE_STATES.validating) return
        const verdict = G.checkRendered('image',
          { naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight }, {})
        finish(verdict.ok)
      }
      // 监听必须先于 `src` 赋值注册：图片命中 HTTP 缓存时，load/error 可能在赋值的
      // 同一个任务里就已派发，后注册的监听会永久错过（占位一直转到超时才降级）。
      img.addEventListener('load', () => { void judge() })
      img.addEventListener('error', () => finish(false))
      // 超时兜底（单块上限，与其它块并行）：到点仍无自然尺寸就降级，避免占位无限旋转
      setTimeout(() => { if (img.naturalWidth === 0) finish(false) }, GATE_BLOCK_TIMEOUT_MS)

      figure.innerHTML = ''
      figure.appendChild(img)
      if (caption) {
        const cap = document.createElement('figcaption')
        cap.textContent = caption
        figure.appendChild(cap)
      }
      img.src = src
    }
  }

  /** mermaid 占位：交给既有渲染链路（懒加载库 + 几何判据），这里只标记已入队。 */
  function settleGateMermaid(root) {
    renderDiagrams(root)
  }

  /**
   * 本轮是否还有块停在判定期（未进入 passed/degraded 终态）。
   * @param root - 气泡容器
   * @returns 存在未结算块返回 true
   */
  function hasUnsettledGates(root) {
    if (!root) return false
    for (const node of root.querySelectorAll('[data-block-state]')) {
      const state = node.dataset.blockState
      if (state !== G.GATE_STATES.passed && state !== G.GATE_STATES.degraded) return true
    }
    return false
  }

  /**
   * `done` 前的收尾窗口（P7 v3.2）：并行等待在飞的块结算，最多 `answerWaitBudgetMs`，
   * 到点仍**未结算的块一律降级**为可读文案。
   *
   * 两条硬约束：① **不得阻塞 `done`**——本函数只在 `done` 事件到达前的极短窗口内轮询，
   * 超窗口立即返回；② 该窗口是**等待上限**而非串行配额，各块判定始终并行推进。
   * @param root - 气泡容器
   */
  async function awaitGateSettlement(root, windowStart) {
    // 窗口必须从 **`done` 帧到达** 起算，而不是从本函数进入时起算：done 处理里先做了
    // 整条正文重渲染与 sources 渲染（实测 ~12ms），若从进入时算，总耗时会变成
    // 「窗口 600ms + 前置耗时」= 614ms，越过 T1 的 600ms 预算。
    const origin = Number.isFinite(windowStart) ? windowStart : Date.now()
    // 留出降级收尾余量：窗口到点后还要执行 degradePendingGates（改写 DOM、回传载荷），
    // 实测这部分约 5~10ms。若把窗口用满 600ms，总耗时会到 606ms 越过预算，因此窗口
    // 本身取 budget − margin，保证「done → 全部结算」整体 ≤ budget。
    const SETTLE_MARGIN_MS = 30
    const deadline = origin + Math.max(0, settleWindowMs() - SETTLE_MARGIN_MS)
    // 轮询步长必须**收敛到 deadline**：固定 20ms 会让最后一次等待越过窗口
    // （实测 600ms 窗口下总延迟 619ms）。这里取「剩余时间」与 20ms 的较小值，
    // 保证窗口用满但不越界。
    while (hasUnsettledGates(root)) {
      const remaining = deadline - Date.now()
      if (remaining <= 0) break
      await new Promise(resolve => setTimeout(resolve, Math.min(20, remaining)))
    }
    // 窗口耗尽：未结算的块按 P6/P7 降级（degradePendingGates 会跳过已终态的块）
    degradePendingGates(root)
  }

  /**
   * 把一个气泡里的图形块推进到终态并渲染。
   * 定稿入口统一走这里，保证「占位 → 终态」只发生一次（REP5：已上屏内容不回改）。
   * @param root - 气泡容器
   */
  async function finalizeBubble(root) {
    settleGatePlaceholders(root)
  }

  /**
   * 历史恢复路径的图形块定稿：与实时回答走同一套判据（E4：刷新不得改变判定）。
   * 历史里的块按视口懒渲染（mermaid 交给 IntersectionObserver），避免刷新时一次性
   * 解析多张大图把首屏拖住。
   * @param root - 聊天区容器
   */
  async function finalizeHistoryGates(root) {
    settleGatePlaceholders(root)
    await renderDiagrams(root, { lazy: true })
  }

  async function send() {
    const text = inputEl.value.trim()
    if (!text) return
    inputEl.value = ''
    addMessage('user', renderMarkdown(text))
    // 新一轮回答：重置门禁计时与回传去重（P7 的「整条回答预算」按轮计算）
    gateTurnStart = Date.now()
    settledGates.clear()
    reportDeduper.reset()
    // 口径 B 台账与块来源按轮隔离
    blockSlots.clear()
    blockOrder.length = 0
    sawBlockEvent = false
    // 渲染器加载失败状态按轮重置（见 mermaidLoadFailed 注释：不永久失败）
    mermaidLoadFailed = false
    // 流式消息气泡：先显示"正在查询"动画，收到首个内容后替换为回答
    const bubbleHost = document.createElement('div')
    bubbleHost.className = 'msg assistant'
    const avatar = document.createElement('div')
    avatar.className = 'avatar'
    avatar.textContent = t('aiLabel')
    const bubble = document.createElement('div')
    bubble.className = 'bubble'
    bubble.innerHTML = `<span class="waiting"><span class="spinner-sm"></span>${t('waiting')}</span>`
    bubbleHost.appendChild(avatar)
    bubbleHost.appendChild(bubble)
    chatEl.appendChild(bubbleHost)
    chatEl.scrollTop = chatEl.scrollHeight
    sendEl.disabled = true
    // State read by the catch block below — must live OUTSIDE the try block
    // (let is block-scoped, so declarations inside try are invisible to catch).
    let streamed = ''
    let sources = []
    let done = false
    let streamError = null
    /** Replace the waiting indicator with real content on the first delta. */
    function showStreamed() {
      bubble.innerHTML = renderStreamMarkdown(streamed)
      chatEl.scrollTop = chatEl.scrollHeight
    }
    try {
      const id = await ensureSession()
      // Hard deadline for the whole request: if ngrok never delivers headers
      // OR stalls mid-stream, aborting the fetch guarantees the catch path
      // runs (and recovers the persisted reply) instead of spinning forever.
      const controller = new AbortController()
      const hardDeadline = setTimeout(() => controller.abort(), 45000)
      let res
      try {
        res = await fetch(`${API_BASE}/api/guest/chat/stream`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          // 带上访客当前选择的界面语言：回答必须跟随它（KB 是繁体，不能照抄 KB 用字）
          body: JSON.stringify({ sessionId: id, message: text, lang }),
          signal: controller.signal,
        })
      } finally {
        clearTimeout(hardDeadline)
      }
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}))
        // Blocked/rate-limited responses carry a user-facing message
        // (e.g. the calm-down notice); prefer it over the raw error code.
        throw new Error(errData.message || errData.error || `request failed (${res.status})`)
      }
      await consumeSse(res, async (event, data) => {
        if (event === 'meta') {
          if (typeof data.version === 'string' && svcVerEl) {
            // Handshake frame: stamp the server build onto the badge.
            svcVerEl.textContent = `前端 ${APP_VERSION} · 服务 ${data.version}`
          }
          // 服务端下发的门禁预算（§12）：单点可调，前端不硬编码
          if (data.gate) applyGateConfig(data.gate)
        } else if (event === 'notice' && typeof data.text === 'string') {
          // Friendly reminder from the moderation layer (first-offence
          // warning): shown above the reply, never blocks the answer.
          const tip = document.createElement('div')
          tip.className = 'msg notice'
          const tipBubble = document.createElement('div')
          tipBubble.className = 'bubble'
          tipBubble.textContent = data.text
          tip.appendChild(tipBubble)
          chatEl.insertBefore(tip, bubbleHost)
        } else if (event === 'block-open' && typeof data.blockId === 'string') {
          // 口径 B：主机侧已把图形块从文字流中摘出，这里只出占位——源码尚未下发，
          // 也不允许从任何地方推断它（P4/V1）。
          sawBlockEvent = true
          blockOrder.push({ blockId: data.blockId, blockType: G.normalizeBlockType(data.blockType) || 'html' })
          blockSlots.set(data.blockId, { blockId: data.blockId, blockType: G.normalizeBlockType(data.blockType) || 'html', source: '', imagePath: '', imageCaption: '', reason: '' })
          refreshBlockSlots(bubble)
        } else if (event === 'block' && data.blockId) {
          // 主机侧裁决结果：`render` 交真机，`degraded` 直接落可读文案（两态都不带围栏源码）
          const decoded = G.decodeBlockPayload(data)
          applyBlockPayload(decoded, data)
          const host = refreshBlockSlots(bubble)
          // P5：块一到就开判，用掉生成窗口
          startClosedGates(host)
        } else if (event === 'delta' && typeof data.text === 'string') {
          const first = streamed === ''
          streamed += data.text
          if (first) showStreamed()
          else {
            paintStream(bubble, renderStreamMarkdown(streamed))
            chatEl.scrollTop = chatEl.scrollHeight
          }
          // P5：块一闭合就开判，用掉生成窗口；已结算/已启动的块由状态机跳过
          startClosedGates(bubble)
        } else if (event === 'sources' && Array.isArray(data.sources)) {
          sources = data.sources
        } else if (event === 'done') {
          done = true
          // T1 预算起点：done 帧到达的那一刻（窗口不得把本帧前置渲染耗时算进去）
          doneFrameAt = Date.now()
          // done 是权威终态：以 blocks/blockResults/degradedIds 为准补齐/纠正本地槽位
          if (Array.isArray(data.blocks)) adoptDoneBlocks(data)
          if (typeof data.reply === 'string' && data.reply) {
            streamed = data.reply
            // 定稿帧带完整正文：未闭合的块也按占位呈现，绝不露出源码（P4/P6）。
            // 同样用 paintStream：不得让定稿重渲染把在飞的块状态清掉。
            paintStream(bubble, renderStreamMarkdown(streamed, { final: true }))
          }
          sources = data.sources || sources
          if (sources.length) {
            const src = document.createElement('div')
            src.className = 'sources'
            src.innerHTML = sources.map(s => `<span>📄 ${esc(s)}</span>`).join('')
            bubble.appendChild(src)
          }
          // 顺序很关键：finalizeBubble 负责**启动**各块的并行判定（建 img、发起 mermaid
          // 渲染与 html 渲染），必须先启动再等窗口——否则窗口等的是尚未开始的活儿。
          // 它自身不能被 await（内部渲染耗时不受 done 约束）。
          finalizeBubble(bubble).catch(() => { /* 判据异常由各块自己降级，不冒泡到回答 */ })
          // 随后在收尾窗口（≤ answerWaitBudgetMs，自 done 帧到达起算）内并行等待结算；
          // 到点未结算的块降级。传入 doneFrameAt 让窗口不把前置渲染耗时算进预算。
          await awaitGateSettlement(bubble, doneFrameAt)
        } else if (event === 'error') {
          streamError = data.error || 'turn failed'
        }
      })
      if (streamError) throw new Error(streamError)
      if (!done && !streamed) throw new Error('stream ended without reply')
      // P9-1（干净 EOF）：流在「有 delta、无 done、连接正常关闭」处结束。此时上面两条判据
      // 都不成立（`streamed` 非空 ⇒ 不抛错），于是**不进入 catch**——而唯一调用
      // `degradePendingGates` 的地方（catch 内）因此不可达，收尾窗口又只挂在 `done` 分支上。
      // 结果：未结算的 pending 块**永久悬挂**（占位一直转圈）。这里补一条**与 done 无关**的
      // 收尾路径：流一旦结束且没有 `done`，立刻把未结算块收敛到可读降级终态。
      // 刻意不抛错、不覆盖已上屏正文（避免把半截回答换成"恢复中/出错"文案）、不阻塞。
      if (!done) degradePendingGates(chatEl)
    } catch (err) {
      // The stream dropped or stalled (proxy timeout / flaky mobile network /
      // ngrok tunnel blip). The server turn usually still finishes and
      // persists the reply, so recover it from history instead of showing a
      // bare error: switch the bubble to a "recovering" state, poll history
      // until the reply for this message appears, then render it.
      const aborted = err && (err.name === 'AbortError' || /stalled|abort/i.test(String(err.message || '')))
      const isNetworkDrop = !done || aborted || /network|fetch|load failed|ended without/i.test(String(err.message || ''))
      if (isNetworkDrop && sessionId) {
        bubble.innerHTML = `<span class="waiting"><span class="spinner-sm"></span>${t('recovering')}</span>`
        // 断流期间仍停在判定期的块按 P9 先降级：已 passed 的保持显示，不回改
        degradePendingGates(chatEl)
        const reply = await recoverReply(text)
        if (reply) {
          bubble.innerHTML = renderStreamMarkdown(reply.text, { final: true })
          if (reply.sources && reply.sources.length) {
            const src = document.createElement('div')
            src.className = 'sources'
            src.innerHTML = reply.sources.map(s => `<span>📄 ${esc(s)}</span>`).join('')
            bubble.appendChild(src)
          }
          chatEl.scrollTop = chatEl.scrollHeight
          await finalizeBubble(bubble)
        } else {
          // Genuine failure (or the server never got the message): show it.
          bubble.innerHTML = `<p>${t('errorGeneric')}${esc(err.message)}</p>`
        }
      } else {
        // Show the error in place of the waiting animation.
        bubble.innerHTML = `<p>${t('errorGeneric')}${esc(err.message)}</p>`
      }
    } finally {
      sendEl.disabled = false
      inputEl.focus()
      turnCount += 1
      maybeWarnContext()
    }
  }

  document.getElementById('newChat').addEventListener('click', () => {
    // 已有对话才需确认，空对话直接开
    if (chatEl.querySelector('.msg') && !window.confirm(t('newChatConfirm'))) return
    void startNewChat()
  })

  sendEl.addEventListener('click', send)
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() }
  })
  // Auto-grow input
  inputEl.addEventListener('input', () => { inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px' })
  // 离开页面：仍在判定期的块按 P9 降级，绝不让半成品图形留在 DOM 里
  window.addEventListener('pagehide', () => degradePendingGates(chatEl))

  // Restore the previous conversation on refresh, then ensure a live session.
  paintServerVersion()
  restoreHistory().finally(() => {
    ensureSession().catch(() => { setStatus('offline') })
  })
})()
</script>
</body>
</html>
