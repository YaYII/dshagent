<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="appTitle">智能客服</title>
<!-- 内联 favicon：避免浏览器自动请求 /favicon.ico 得到 404（日志与控制台噪音） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='24' font-size='20' text-anchor='middle' fill='%23ffffff'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --text: #1f2937; --muted: #6b7280;
    --brand: #2563eb; --brand-weak: #eff6ff; --border: #e5e7eb;
    --user-bubble: #2563eb; --user-text: #fff; --assistant-bubble: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100%;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 10px;
    flex: 0 0 auto;
  }
  header .logo {
    width: 32px; height: 32px; border-radius: 8px; background: var(--brand);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header .status { font-size: 12px; color: var(--muted); }
  header .langs { margin-left: auto; display: flex; gap: 4px; align-items: center; }
  header .langs button {
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    border-radius: 8px; padding: 2px 9px; font-size: 12px; line-height: 1.6; cursor: pointer;
  }
  header .langs button:hover { border-color: var(--brand); color: var(--brand); }
  header .langs button.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  /* 服务标识条：会话工号 + 版本（问题定位） */
  .svc-badge {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    background: #eef4ff; border-bottom: 1px solid var(--border);
    padding: 3px 12px; font-size: 11.5px; color: #4b5563;
    font-variant-numeric: tabular-nums; user-select: text;
  }
  .svc-badge .svc-agent { font-weight: 600; color: var(--brand); }
  .svc-badge .svc-ver { color: #6b7280; }
  #chat { flex: 1 1 auto; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; max-width: 86%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #fff;
  }
  .msg.user .avatar { background: var(--brand); }
  .msg.assistant .avatar { background: #10b981; }
  .bubble {
    padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px;
    overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--user-bubble); color: var(--user-text); border-top-right-radius: 2px; }
  .msg.assistant .bubble { background: var(--assistant-bubble); border: 1px solid var(--border); border-top-left-radius: 2px; }
  .msg.notice { align-self: center; max-width: 90%; }
  .msg.notice .bubble {
    background: #fef9e7; border: 1px solid #f5e6b8; color: #8a6d1a;
    font-size: 12.5px; padding: 6px 12px; border-radius: 10px;
    text-align: center;
  }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 8px 18px; }
  .bubble code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bubble pre { background: #111827; color: #e5e7eb; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 13px; margin: 8px 0; }
  .bubble pre code { background: none; color: inherit; padding: 0; }
  .bubble table { border-collapse: separate; border-spacing: 0; margin: 10px 0; font-size: 13px; width: 100%; overflow: hidden;
    border: 1px solid var(--border); border-radius: 10px; }
  .bubble th, .bubble td { border-bottom: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  .bubble tr:last-child td { border-bottom: 0; }
  .bubble th { background: var(--brand-weak); color: #1e3a8a; font-weight: 600; }
  .bubble tbody tr:nth-child(even) td { background: #fafbfc; }
  .bubble img { max-width: 100%; border-radius: 8px; margin: 6px 0; }
  /* 柱状图（```chart）：品牌色渐变胶囊条 + 数值徽标 */
  .chart { margin: 12px 0; padding: 12px 14px; background: #fff; border: 1px solid var(--border); border-radius: 12px; }
  .chart .bar-row { display: flex; align-items: center; gap: 10px; margin: 5px 0; font-size: 13px; }
  .chart .bar-row .label { width: 96px; text-align: right; flex: 0 0 auto; color: #4b5563; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart .bar-row .bar { height: 20px; border-radius: 10px; min-width: 6px;
    background: linear-gradient(90deg, #60a5fa, var(--brand)); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .06); }
  .chart .bar-row > span:last-child { flex: 0 0 auto; color: #1e3a8a; font-weight: 600; font-variant-numeric: tabular-nums; }
  /* Mermaid 图表（思维脑图/流程图/时序图）：渲染成功后是 SVG；宽图横向滚动 */
  .bubble .mermaid-src { margin: 12px 0; overflow-x: auto; }
  .bubble .mermaid-src.mermaid-done {
    position: relative; padding: 14px 16px; border-radius: 12px;
    background: linear-gradient(180deg, #ffffff, #fbfcfe);
    border: 1px solid var(--border); box-shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 8px 24px -18px rgba(15, 23, 42, .25);
  }
  .bubble .mermaid-src.mermaid-done svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  /* 放大提示：悬停时右上角浮出放大镜，明确"图可点开" */
  .bubble .mermaid-src.mermaid-done::after, .bubble .kb-image::after {
    content: '⤢'; position: absolute; top: 8px; right: 10px; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1;
    color: #475569; background: rgba(255, 255, 255, .92); border: 1px solid var(--border); border-radius: 7px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .08); opacity: 0; transition: opacity .18s ease;
  }
  .bubble .mermaid-src.mermaid-done:hover::after, .bubble .kb-image:hover::after { opacity: 1; }
  /* HTML 预览（```html 块）：沙箱 iframe，可拖拽调高度、可切换源码 */
  .bubble .html-block { margin: 12px 0; border: 1px solid var(--border); border-radius: 12px; background: #fff; overflow: hidden;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .06); }
  .bubble .html-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px;
    background: #f8fafc; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .bubble .html-bar button { border: 1px solid var(--border); background: #fff; border-radius: 7px; padding: 3px 9px;
    font-size: 12px; color: #475569; cursor: pointer; }
  .bubble .html-bar button:hover { border-color: var(--brand); color: var(--brand); }
  /* 预览高度：默认按视口自适应（脚本回传内容高度后再精确贴合，见 applyHtmlFrameHeight） */
  .bubble .html-frame { display: block; width: 100%; border: 0; background: #fff;
    height: clamp(180px, 42vh, 520px); transition: height .18s ease; }
  .bubble .html-src { margin: 0; border-radius: 0; }
  /* 图片阅读器：可点开的图片/图表 + 深色毛玻璃底的放大查看层 */
  .bubble img, .bubble .mermaid-src.mermaid-done { cursor: zoom-in; }
  .viewer {
    position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    opacity: 0; transition: opacity .25s ease; touch-action: none; overflow: hidden;
  }
  .viewer.show { opacity: 1; }
  .viewer-stage { max-width: 92vw; max-height: 88vh; transform-origin: center center; cursor: grab; will-change: transform; }
  .viewer-stage.dragging { cursor: grabbing; }
  .viewer-stage img, .viewer-stage svg {
    max-width: 92vw; max-height: 88vh; width: auto; height: auto; display: block;
    background: #fff; border-radius: 10px; padding: 6px; box-shadow: 0 24px 70px rgba(0, 0, 0, .55);
  }
  .viewer-bar { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; }
  .viewer-bar button {
    width: 40px; height: 40px; border: 0; border-radius: 50%; cursor: pointer; font-size: 17px; line-height: 1;
    color: #1f2937; background: rgba(255, 255, 255, .92); box-shadow: 0 6px 18px rgba(0, 0, 0, .3);
    display: flex; align-items: center; justify-content: center; transition: transform .15s ease, background .15s ease;
  }
  .viewer-bar button:hover { background: #fff; transform: scale(1.07); }
  .viewer-scale {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    color: #e5e7eb; font-size: 12.5px; font-variant-numeric: tabular-nums;
    background: rgba(0, 0, 0, .45); padding: 3px 10px; border-radius: 999px;
  }
  /* 阅读器里图片取不到：显示提示文字而不是一个白点占位 */
  .viewer-stage.broken { max-width: 80vw; color: #e5e7eb; font-size: 13px; text-align: center; white-space: pre-line; transform: none; }
  .viewer-stage.broken img { display: none; }
  .viewer-stage.broken::before { content: attr(data-fallback); display: block; line-height: 1.7; }
  @media (max-width: 640px) { .viewer-bar button { width: 36px; height: 36px; font-size: 15px; } }
  /* 知识库图片（```image 块）：点击可放大；加载失败降级成提示文字，不留破图 */
  .bubble .kb-image { position: relative; display: inline-block; margin: 12px 0; padding: 8px; background: #fff;
    border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 1px 3px rgba(15, 23, 42, .06); }
  .bubble .kb-image img { display: block; width: 100%; max-width: 420px; border-radius: 8px; }
  .bubble .kb-image figcaption { margin-top: 6px; font-size: 12px; color: var(--muted); text-align: center; }
  .bubble .kb-image.broken img { display: none; }
  .bubble .kb-image.broken::before {
    content: attr(data-fallback); display: block; padding: 10px 12px; font-size: 13px; color: var(--muted);
    border: 1px dashed var(--border); border-radius: 8px; background: #fafafa;
  }
  .sources { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .sources span { background: var(--brand-weak); padding: 1px 6px; border-radius: 10px; margin-right: 6px; }
  #composer { flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 10px; }
  #input {
    flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
    font-size: 14px; outline: none; resize: none; font-family: inherit; max-height: 120px;
  }
  #input:focus { border-color: var(--brand); }
  #send {
    background: var(--brand); color: #fff; border: none; border-radius: 10px;
    padding: 0 20px; font-size: 14px; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }
  #welcome { text-align: center; color: var(--muted); margin: auto; }
  #welcome h2 { color: var(--text); margin-bottom: 8px; font-size: 20px; }
  #welcome .suggestions {
    margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center;
  }
  #welcome .suggestions .sug {
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 18px; font-size: 13.5px; color: var(--text); cursor: pointer;
    transition: all .15s ease; user-select: none;
  }
  #welcome .suggestions .sug:hover {
    border-color: var(--brand); color: var(--brand); background: var(--brand-weak);
    transform: translateY(-1px);
  }
  #restoring { text-align: center; color: var(--muted); margin: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #restoring p { font-size: 14px; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--brand-weak);
    border-top-color: var(--brand);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* "正在查询中" 等待指示（回答首字到达前的占位动画） */
  .waiting {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 14px;
  }
  .spinner-sm {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--brand-weak);
    border-top-color: var(--brand);
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }
  .typing::after { content: "…"; animation: dots 1.2s infinite; }
  @keyframes dots { 0% { content: ""; } 33% { content: "."; } 66% { content: ".."; } 100% { content: "..."; } }
</style>
</head>
<body>
<header>
  <div class="logo">客</div>
  <h1 data-i18n="appTitle">智能客服</h1>
  <span class="status" id="status" data-i18n="connecting">连接中…</span>
  <div class="langs" id="langs">
    <button type="button" data-lang="zh">简体</button>
    <button type="button" data-lang="zhHant">繁體</button>
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="pt">PT</button>
  </div>
</header>
<!-- 服务标识条：报出会话工号即可定位是哪个会话、哪个版本（问题排查用） -->
<div class="svc-badge" id="svcBadge" title="会话工号 + 版本号（问题定位用）">
  <span class="svc-agent" id="svcAgent">工号 --</span>
  <span class="svc-ver" id="svcVer">v--</span>
</div>

<div id="chat">
  <div id="welcome">
    <h2 data-i18n="welcomeTitle">您好，我是智能客服助手 👋</h2>
    <p data-i18n="welcomeBody">我可以回答关于产品、政策、价格等问题。请问有什么可以帮您？</p>
    <div id="suggestions" class="suggestions"></div>
  </div>
  <!-- 刷新后恢复历史期间的加载动画 -->
  <div id="restoring" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <p data-i18n="restoring">正在恢复对话记录…</p>
  </div>
</div>

<div id="composer">
  <textarea id="input" rows="1" data-i18n-placeholder="inputPlaceholder" placeholder="请输入您的问题…" enterkeyhint="send"></textarea>
  <button id="send" data-i18n="send">发送</button>
</div>

<script>
(() => {
  'use strict'

  // ── i18n：界面文案按访客系统语言自动切换（zh 简中 / zhHant 繁中 / en / pt，en 兜底）──
  // 新增语言只需在此加一个字典；key 不变，页面/逻辑无需改动。
  const I18N = {
    zh: {
      appTitle: '智能客服',
      connecting: '连接中…',
      online: '在线',
      offline: '离线',
      welcomeTitle: '您好，我是智能客服助手 👋',

      restoring: '正在恢复对话记录…',

      // 图片阅读器（点击图片/图表放大查看）按钮文案

      viewerZoomOut: '缩小',
      viewerReset: '复位',
      viewerOpenTab: '新窗口打开',

      imageUnavailable: '图片暂时无法显示（源站可能已移除该图）',
      // 建议问题（欢迎页快捷提问），点击即发送

    },
    zhHant: {
      appTitle: '智能客服',
      connecting: '連接中…',
      online: '在線',
      offline: '離線',
      welcomeTitle: '您好，我是智能客服助手 👋',
      welcomeBody: '我可以回答關於產品、政策、價格等問題。請問有什麼可以幫您？',
      restoring: '正在恢復對話記錄…',
      recovering: '網絡不穩定，正在為您恢復回答…',

      errorGeneric: '抱歉，出了點問題：',
      userLabel: '我',
      aiLabel: 'AI',
      // 圖片閱讀器（點擊圖片/圖表放大查看）按鈕文案
      viewerZoomIn: '放大',
      viewerZoomOut: '縮小',
      viewerReset: '重設',

      // 建議問題（歡迎頁快捷提問），點擊即傳送

    },
    en: {
      appTitle: 'Customer Service',
      connecting: 'Connecting…',
      online: 'Online',
      offline: 'Offline',
      welcomeTitle: 'Hello, I am your customer-service assistant 👋',
      welcomeBody: 'I can answer questions about our products, policies, pricing and more. How can I help?',
      restoring: 'Restoring your conversation…',

      inputPlaceholder: 'Type your question…',
      send: 'Send',
      waiting: 'Searching…',
      errorGeneric: 'Sorry, something went wrong: ',
      userLabel: 'You',
      aiLabel: 'AI',
      viewerZoomIn: 'Zoom in',
      viewerZoomOut: 'Zoom out',
      viewerReset: 'Reset',
      viewerOpenTab: 'Open in new tab',
      viewerDownload: 'Download image',
      viewerClose: 'Close (Esc)',
      htmlPreview: 'HTML preview',

      imageUnavailable: 'Image unavailable (it may have been removed from the source site)',
      suggestions: ['What is the customer service hotline?', 'How can I pay my electricity bill?', 'What should I do during a power outage?', 'How do I charge my electric vehicle?'],
    },
    pt: {

      connecting: 'A conectar…',

      offline: 'Offline',
      welcomeTitle: 'Olá, sou o seu assistente de apoio ao cliente 👋',
      welcomeBody: 'Posso responder a perguntas sobre produtos, políticas, preços e mais. Como posso ajudar?',
      restoring: 'A restaurar a sua conversa…',
      recovering: 'Ligação instável, a recuperar a sua resposta…',
      inputPlaceholder: 'Escreva a sua pergunta…',
      send: 'Enviar',
      waiting: 'A pesquisar…',
      errorGeneric: 'Desculpe, ocorreu um erro: ',
      userLabel: 'Eu',
      aiLabel: 'IA',
      viewerZoomIn: 'Ampliar',
      viewerZoomOut: 'Reduzir',
      viewerReset: 'Repor',
      viewerOpenTab: 'Abrir em novo separador',
      viewerDownload: 'Transferir imagem',
      viewerClose: 'Fechar (Esc)',
      htmlPreview: 'Pré-visualização HTML',
      htmlSource: 'Ver código',
      htmlSourceHide: 'Ocultar código',
      imageUnavailable: 'Imagem indisponível (pode ter sido removida do site de origem)',
      suggestions: ['Qual é a linha de apoio ao cliente?', 'Como posso pagar a conta de eletricidade?', 'O que fazer durante uma falha de energia?', 'Como carrego o meu veículo elétrico?'],
    },
  }

  /** Resolve the visitor's UI language from browser preference order. */
  function detectLang() {
    const prefs = (navigator.languages && navigator.languages.length)
      ? navigator.languages
      : [navigator.language || navigator.userLanguage || '']
    for (const pref of prefs) {
      const raw = String(pref || '').toLowerCase()
      // Traditional Chinese regions and explicit Hant script tags.
      if (raw.startsWith('zh')) {
        if (/zh[-_]?(tw|hk|mo|hant)/.test(raw)) return 'zhHant'
        return 'zh'
      }
      if (raw.startsWith('pt')) return 'pt'
    }
    return 'en'
  }

  const LANG_KEY = 'dshagent_lang'
  // An explicit visitor choice (header switcher) wins; otherwise fall back
  // to the browser's preferred languages. Browsers do not expose the OS
  // language, so a Chinese-system visitor whose browser is set to English
  // sees English until they switch — the buttons in the header fix that.
  let lang = localStorage.getItem(LANG_KEY)
  if (!I18N[lang]) lang = detectLang()
  let dict = I18N[lang] ?? I18N.en

  /** Translate a UI key for the active language. */
  function t(key) {
    return dict[key] ?? I18N.en[key] ?? key
  }

  /** Apply translations to static markup: [data-i18n] text and placeholders. */
  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n')
      if (key) el.textContent = t(key)
    })
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder')
      if (key) el.placeholder = t(key)
    })
    const titleEl = document.querySelector('title')
    if (titleEl) titleEl.textContent = t('appTitle')
  }

  // Connection status shown in the header. Kept as a key so it follows
  // language switches instead of freezing the text from page load.
  let statusKey = 'connecting'
  function setStatus(key) {
    statusKey = key
    const el = document.getElementById('status')
    if (el) el.textContent = t(key)
  }

  /**
   * Switch the live UI language. persist=true records an explicit visitor
   * choice so the next visit keeps it; auto-detection remains the default
   * until the visitor actually clicks a button.
   */
  function applyLang(next, persist) {
    lang = next
    dict = I18N[next] ?? I18N.en
    if (persist) {
      try { localStorage.setItem(LANG_KEY, next) } catch { /* storage unavailable */ }
    }
    document.documentElement.lang = next === 'zh' ? 'zh-CN' : (next === 'zhHant' ? 'zh-Hant' : next)
    document.querySelectorAll('#langs button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === next)
    })
    applyI18n()
    renderSuggestions()
    setStatus(statusKey)
    // Existing bubbles keep their content, but avatar labels follow the
    // active language.
    document.querySelectorAll('.msg .avatar').forEach(av => {
      const msg = av.closest('.msg')
      av.textContent = msg && msg.classList.contains('user') ? t('userLabel') : t('aiLabel')
    })
  }

  document.querySelectorAll('#langs button').forEach(btn => {
    btn.addEventListener('click', () => applyLang(btn.dataset.lang, true))
  })
  applyLang(lang, false)

  /** Render the welcome-page suggested questions (click to ask). */
  function renderSuggestions() {
    const box = document.getElementById('suggestions')
    if (!box) return
    const items = dict.suggestions ?? []
    box.innerHTML = ''
    for (const q of items) {
      const chip = document.createElement('button')
      chip.type = 'button'
      chip.className = 'sug'
      chip.textContent = q
      chip.addEventListener('click', () => {
        // Ask the question immediately: fill the composer and send.
        inputEl.value = q
        send()
      })
      box.appendChild(chip)
    }
  }

  const chatEl = document.getElementById('chat')
  const welcomeEl = document.getElementById('welcome')
  const inputEl = document.getElementById('input')
  const sendEl = document.getElementById('send')
  let sessionId = localStorage.getItem('dshagent_session') || null

  // ── 版本标识：每次发布递增，方便定位访客用的是哪个版本 ──────────────
  // 前端（此页面）版本号：改页面后 +1；服务端版本由 guest-server 注入。
  const APP_VERSION = 'v2.7.1'
  const svcAgentEl = document.getElementById('svcAgent')
  const svcVerEl = document.getElementById('svcVer')
  if (svcVerEl) svcVerEl.textContent = `前端 ${APP_VERSION} · 服务 --`

  /**
   * Derive a short human-facing agent number from a session id (stable for a
   * given conversation, survives refresh) so a visitor or operator can report
   * "会话工号 #XXXXXX" and the exact session/version can be located.
   */
  function agentNoOf(id) {
    if (!id) return '--'
    const hex = String(id).replace(/^guest-/, '').replace(/-/g, '')
    return '#' + hex.slice(-6).toUpperCase()
  }
  function paintAgentBadge() {
    if (svcAgentEl) svcAgentEl.textContent = '工号 ' + agentNoOf(sessionId)
  }
  paintAgentBadge()

  /**
   * Best-effort server-build stamp for the badge: one lightweight /health
   * call at load (no session needed). If the tunnel/network fails, the badge
   * keeps its placeholder until a chat meta event or the next reload stamps
   * it. API_BASE is only read when this runs (boot), never at define time.
   */
  function paintServerVersion() {
    if (!svcVerEl) return
    const ac = new AbortController()
    const timer = setTimeout(() => ac.abort(), 8000)
    fetch(`${API_BASE}/api/guest/health`, { signal: ac.signal })
      .then(res => (res.ok ? res.json() : null))
      .then(body => {
        if (body && typeof body.version === 'string') {
          svcVerEl.textContent = `前端 ${APP_VERSION} · 服务 ${body.version}`
        }
      })
      .catch(() => { /* offline / tunnel blip: keep the placeholder */ })
      .finally(() => clearTimeout(timer))
  }

  // API base: when served behind a reverse-proxy path prefix (e.g.
  // https://host/dshagent/), the guest API lives under the same prefix
  // (/dshagent/api/guest/*). Derive it from the page URL so both direct
  // (http://127.0.0.1:10800/) and proxied deployments work unchanged.
  const pagePath = window.location.pathname
  const API_BASE = pagePath.endsWith('/')
    ? pagePath.replace(/\/+$/, '')
    : pagePath.replace(/\/[^/]*$/, '')

  /** Persist the session id so a page refresh resumes the same conversation. */
  function saveSession(id) {
    sessionId = id
    paintAgentBadge()
    try { localStorage.setItem('dshagent_session', id) } catch { /* storage unavailable */ }
  }

  /** Tiny HTML escaper (XSS-safe by default: text is never raw HTML). */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]))

  /** Minimal inline Markdown: paragraphs, code, tables, lists, images, links. */
  function renderMarkdown(src) {
    const lines = src.split(/\n/)
    const out = []
    let i = 0
    let inList = false
    while (i < lines.length) {
      const line = lines[i]
      const codeFence = /^```\s*([\w-]*)\s*(.*)$/.exec(line)
      if (codeFence) {
        inList = false
        const lang = codeFence[1].toLowerCase()
        // 语言后可能跟着图表关键字（如 ```mermaid mindmap），一并交给渲染器
        const info = codeFence[2].trim()
        const buf = []
        i++
        let closed = false
        while (i < lines.length) {
          if (/^```/.test(lines[i])) { closed = true; break }
          buf.push(lines[i])
          i++
        }
        if (closed) i++ // closing fence
        const body = buf.join('\n')
        // 流式回答里围栏还没收尾时先当代码块：半截路径/半截语法拿去渲染会发出
        // 无效请求（实测 /uploads/tos_bg_d37 被请求 → 404）并造成闪动。
        const needsClose = lang === 'mermaid' || lang === 'image' || lang === 'img' || lang === 'chart' || lang === 'html'
        if (needsClose && !closed) {
          out.push(`<pre><code>${esc(body)}</code></pre>`)
          continue
        }
        if (lang === 'mermaid') out.push(renderMermaidBlock(info, body))
        else if (lang === 'image' || lang === 'img') out.push(renderImageBlock(body))
        else if (lang === 'chart') out.push(renderChart(body))
        else if (lang === 'html') out.push(renderHtmlBlock(body))
        else out.push(`<pre><code>${esc(body)}</code></pre>`)
        continue
      }
      const tableStart = /^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])
      if (tableStart) {
        inList = false
        const header = line.split('|').map(s => s.trim()).filter((s, idx, a) => !(idx === 0 && s === '') && !(idx === a.length - 1 && s === ''))
        i += 2
        const rows = []
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
          rows.push(lines[i].split('|').map(s => s.trim()).filter((s, idx, a) => !(idx === 0 && s === '') && !(idx === a.length - 1 && s === '')))
          i++
        }
        out.push(`<table><thead><tr>${header.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${
          rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')
        }</tbody></table>`)
        continue
      }
      const listMatch = /^\s*[-*]\s+(.*)/.exec(line)
      if (listMatch) {
        if (!inList) { out.push('<ul>'); inList = true }
        out.push(`<li>${inlineMd(listMatch[1])}</li>`)
        i++
        continue
      }
      if (inList) { out.push('</ul>'); inList = false }
      if (/^\s*$/.test(line)) { i++; continue }
      const heading = /^(#{1,4})\s+(.*)/.exec(line)
      if (heading) {
        const level = Math.min(heading[1].length + 1, 5)
        out.push(`<h${level}>${inlineMd(heading[2])}</h${level}>`)
        i++
        continue
      }
      out.push(`<p>${inlineMd(line)}</p>`)
      i++
    }
    if (inList) out.push('</ul>')
    return out.join('')
  }

  /**
   * 知识库图片地址归一化：vault 里存的是源站绝对路径（/uploads/xxx.png，源站
   * 为 www.cem-macau.com），统一改走本站反向代理 /uploads/ —— 访客从我们这里
   * 同源取图，https 页面下不会触发混合内容拦截，也能被 nginx 缓存。
   * @param url - 原文里的图片地址
   * @returns 页面可直接加载的地址
   */
  function imageSrcOf(url) {
    const m = /^(?:https?:\/\/(?:www\.)?cem-macau\.com)?(\/uploads\/[^\s)]+)$/.exec(url)
    return m ? `${API_BASE}${m[1]}` : url
  }

  /** Inline formatting: bold, code, image, link. */
  function inlineMd(s) {
    let t = esc(s)
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>')
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_m, alt, url) => {
      if (/^(https?:|data:image\/|\/)/.test(url)) {
        return `<img src="${esc(imageSrcOf(url))}" alt="${esc(alt)}" loading="lazy">`
      }
      return `[${esc(alt)}]`
    })
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_m, label, url) => {
      if (/^(https?:|mailto:)/.test(url)) return `<a href="${esc(url)}" target="_blank" rel="noopener">${label}</a>`
      return label
    })
    return t
  }

  /**
   * ```image 代码块 → 知识库图片。模型按约定把图片路径放进块内（可再跟一行
   * 说明），路径统一走本站 /uploads 反向代理；加载失败时由委托的 error 监听
   * 降级成提示文字，不会留破图。
   */
  function renderImageBlock(body) {
    const lines = body.split('\n').map(line => line.trim()).filter(Boolean)
    const raw = (lines[0] || '').replace(/^`+|`+$/g, '')
    // 只认完整图片地址（data: 或带图片扩展名的路径），半截路径一律不请求
    const looksLikeImage = /^data:image\//.test(raw)
      || (/^(https?:|\/)/.test(raw) && /\.(png|jpe?g|gif|webp|avif|svg|bmp)(\?|#|$)/i.test(raw))
    if (!looksLikeImage) return `<pre><code>${esc(body)}</code></pre>`
    const caption = lines.slice(1).join(' ')
    return `<figure class="kb-image"><img src="${esc(imageSrcOf(raw))}" alt="${esc(caption)}" loading="lazy">`
      + (caption ? `<figcaption>${esc(caption)}</figcaption>` : '')
      + '</figure>'
  }

  /** 沙箱预览里的基础排版：模型 HTML 没带样式时也不至于是一坨裸标签，并且
   * 在窄屏（手机）上不撑破容器——宽内容改为内部滚动而非溢出。 */
  const HTML_PREVIEW_CSS = `
    :root { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; }
    html { max-width: 100%; }
    body { margin: 0; padding: 12px 14px; max-width: 100%; overflow-x: auto; background: #fff; color: #1f2937;
      font: 14px/1.65 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif; }
    /* 顶层元素占满可用宽度（自带的 max-width 仍生效并居中），窄屏自动变成单列 */
    body > * { max-width: 100%; margin-inline: auto; }
    h1, h2, h3, h4 { margin: 0 0 8px; font-weight: 600; line-height: 1.35; }
    h1 { font-size: 18px } h2 { font-size: 16px } h3 { font-size: 15px }
    p, ul, ol { margin: 0 0 10px } ul, ol { padding-left: 20px }
    table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; border: 1px solid #e5e7eb; border-radius: 10px; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 8px 12px; text-align: left; word-break: break-word; }
    tr:last-child td { border-bottom: 0; }
    th { background: #eff6ff; color: #1e3a8a; font-weight: 600; }
    tbody tr:nth-child(even) td { background: #fafbfc; }
    code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
    pre { background: #111827; color: #e5e7eb; padding: 10px; border-radius: 8px; overflow-x: auto; }
    a { color: #2563eb; }
    img, svg, video, canvas { max-width: 100%; height: auto; }
    .card, .box, .panel { border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; }
    /* 模型常用的多列布局在窄屏退化为单列 */
    @media (max-width: 640px) {
      [style*="display:flex"], [style*="display: flex"], .grid, .row, .cols { flex-direction: column !important; }
      [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    }
  `

  /**
   * 高度上报脚本：沙箱 iframe 是跨源隔离的（opaque origin），父页面既读不到
   * contentDocument，子文档也不能主动访问父页面。唯一安全的自动测量方式是给
   * 它一次 postMessage 的机会——所以只放行这一段由本页写入的脚本（CSP 用随机
   * nonce 锁定），模型自己写的脚本/内联事件仍被 CSP 拒绝执行。
   */
  const HTML_HEIGHT_REPORTER = 'addEventListener("load",function(){'
    + 'function report(){parent.postMessage({dshHtmlHeight:document.documentElement.scrollHeight},"*")}'
    + 'report();addEventListener("resize",report);'
    + 'if(window.ResizeObserver){new ResizeObserver(report).observe(document.documentElement)}'
    + '},false);'

  /**
   * ```html 代码块 → 沙箱预览。模型输出一律按不可信内容处理：iframe 用
   * sandbox="allow-scripts"（只给脚本执行权、绝不给 same-origin），srcdoc 内再用
   * CSP 把脚本限制到本页写入的那一段（随机 nonce），并禁止表单提交、外部请求与
   * base-uri。因此 HTML 能正常排版、能自适应高度，却拿不到本页 DOM/Cookie。
   * 高度由子文档回传、父页面按视口夹紧（手机不会一屏占满，PC 不会截断内容）。
   */
  function renderHtmlBlock(body) {
    const nonce = Math.random().toString(36).slice(2) + Date.now().toString(36)
    const doc = '<!doctype html><meta charset="utf-8">'
      + `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; form-action 'none'; base-uri 'none'; script-src 'nonce-${nonce}'">`
      + `<style>${HTML_PREVIEW_CSS}</style>`
      + body
      // 注意：字符串里必须是 <\/script>，否则 HTML 解析器会提前结束本页脚本块
      + `<script nonce="${nonce}">${HTML_HEIGHT_REPORTER}<\/script>`
    return '<div class="html-block">'
      + `<div class="html-bar"><span>${t('htmlPreview')}</span><button type="button" class="html-src-toggle">${t('htmlSource')}</button></div>`
      + `<iframe class="html-frame" sandbox="allow-scripts" referrerpolicy="no-referrer" loading="lazy" title="HTML 预览" srcdoc="${esc(doc)}"></iframe>`
      + `<pre class="html-src" hidden><code>${esc(body)}</code></pre>`
      + '</div>'
  }

  /** 把某个预览 iframe 的高度设为「内容高度」，并按当前视口夹紧。 */
  function applyHtmlFrameHeight(frame) {
    const content = Number(frame.dataset.contentHeight || 0)
    if (!content) return
    const max = Math.min(Math.round(window.innerHeight * 0.85), 900)
    frame.style.height = `${Math.min(Math.max(content + 2, 120), max)}px`
    frame.dataset.clamped = content + 2 > max ? '1' : ''
  }

  /**
   * 接收预览子文档回传的内容高度。只认本页自己的 iframe（比对 event.source），
   * 沙箱 origin 为 null 不可作为判据；窗口尺寸变化时按新视口重新夹紧。
   */
  window.addEventListener('message', event => {
    const data = event.data
    if (!data || typeof data.dshHtmlHeight !== 'number') return
    const frame = [...document.querySelectorAll('.html-frame')].find(item => item.contentWindow === event.source)
    if (!frame) return
    frame.dataset.contentHeight = String(Math.max(0, Math.round(data.dshHtmlHeight)))
    applyHtmlFrameHeight(frame)
  })

  window.addEventListener('resize', () => {
    for (const frame of document.querySelectorAll('.html-frame')) applyHtmlFrameHeight(frame)
  })

  /** Render a ```chart JSON block into a simple horizontal bar list. */
  function renderChart(body) {
    try {
      const data = JSON.parse(body)
      if (!Array.isArray(data)) return `<pre><code>${esc(body)}</code></pre>`
      const rows = data.map(d => {
        const label = d.label ?? d.name ?? '?'
        const value = Number(d.value ?? d.count ?? 0)
        const max = Math.max(...data.map(x => Number(x.value ?? x.count ?? 0)), 1)
        const pct = max > 0 ? Math.round(value / max * 100) : 0
        return `<div class="bar-row"><span class="label">${esc(label)}</span><div class="bar" style="width:${Math.max(pct, 2)}%"></div><span>${value}</span></div>`
      }).join('')
      return `<div class="chart">${rows}</div>`
    } catch {
      return `<pre><code>${esc(body)}</code></pre>`
    }
  }

  /**
   * ```mermaid 代码块 → 渲染容器。mermaid 体积 3.5MB，只在回答里真的出现
   * 图表时才懒加载（见 renderDiagrams），访客平时完全不下载。容器里先放
   * 原始代码作为兜底：库加载失败或语法错误时，用户看到的仍是可读的代码。
   */
  function renderMermaidBlock(info, body) {
    const head = body.trimStart()
    const src = info && !head.startsWith(info) ? `${info}\n${body}` : body
    return `<div class="mermaid-src" data-src="${esc(src)}"><pre><code>${esc(src)}</code></pre></div>`
  }

  // ── Mermaid 本地渲染（离线，浏览器端出图）─────────────────────────────
  // 库文件随页面一起部署（/assets/mermaid-11.16.0.min.js，取本仓库已锁定的
  // mermaid 11.16.0），渲染全在访客浏览器里完成，不需要任何在线渲染服务。
  const MERMAID_ASSET = 'assets/mermaid-11.16.0.min.js'

  // 品牌主题：mermaid 自带 base 主题 + themeVariables/themeCSS 就是官方的样式包
  // 机制（离线、随库版本匹配）。配色与页面一致（--brand #2563eb / 浅底深字），
  // 脑图走 cScale0..11 调色板，时序图/流程图/饼图各自补齐可读性参数。
  // 改这里的任何一项都要同时改 MERMAID_RENDER_FINGERPRINT，否则访客会继续
  // 命中旧样式缓存（已渲染 SVG 是按指纹缓存的）。
  const MERMAID_THEME = {
    theme: 'base',
    themeVariables: {
      fontFamily: '"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif',
      fontSize: '14px',
      textColor: '#1f2937',
      primaryColor: '#eff6ff', primaryTextColor: '#1e3a8a', primaryBorderColor: '#2563eb',
      secondaryColor: '#f8fafc', secondaryTextColor: '#334155', secondaryBorderColor: '#cbd5e1',
      tertiaryColor: '#ffffff', tertiaryTextColor: '#1f2937', tertiaryBorderColor: '#e5e7eb',
      mainBkg: '#eff6ff', nodeBorder: '#2563eb', lineColor: '#94a3b8',
      clusterBkg: '#f8fafc', clusterBorder: '#cbd5e1', edgeLabelBackground: '#ffffff',
      actorBkg: '#ffffff', actorBorder: '#2563eb', actorTextColor: '#1e3a8a', actorLineColor: '#cbd5e1',
      signalColor: '#334155', signalTextColor: '#1f2937',
      labelBoxBkgColor: '#eff6ff', labelBoxBorderColor: '#2563eb', labelTextColor: '#1e3a8a',
      loopTextColor: '#334155',
      noteBkgColor: '#fffbeb', noteBorderColor: '#fcd34d', noteTextColor: '#78350f',
      pie1: '#2563eb', pie2: '#0ea5e9', pie3: '#14b8a6', pie4: '#f59e0b', pie5: '#8b5cf6', pie6: '#ef4444',
      pieStrokeColor: '#ffffff', pieTitleTextSize: '15px', pieSectionTextSize: '13px', pieOuterStrokeColor: '#e5e7eb',
      // 脑图分支色取同色系浅色调：脑图里的文字固定是深色，饱和中色（如 #8b5cf6）
      // 会让深字对比度掉到 3.5 以下（实测 3.47），浅色调保留颜色区分且 ≥4.5。
      cScale0: '#bfdbfe', cScale1: '#bae6fd', cScale2: '#99f6e4', cScale3: '#fde68a',
      cScale4: '#ddd6fe', cScale5: '#fbcfe8', cScale6: '#bbf7d0', cScale7: '#fed7aa',
      cScale8: '#a5f3fc', cScale9: '#e9d5ff', cScale10: '#fef08a', cScale11: '#e2e8f0',
    },
    flowchart: { curve: 'basis', htmlLabels: true, padding: 14, nodeSpacing: 46, rankSpacing: 46, useMaxWidth: true },
    sequence: { useMaxWidth: true, wrap: true, diagramMarginX: 8, diagramMarginY: 8, actorMargin: 46, messageFontSize: 13, noteFontSize: 13, boxMargin: 8 },
    mindmap: { useMaxWidth: true, padding: 12, maxNodeWidth: 220 },
    // 圆角 + 轻投影 + 统一字重：默认主题的直角灰框看起来像草稿
    themeCSS: `
      .node rect, .node circle, .node ellipse, .node polygon, .node path { rx: 9px; ry: 9px; }
      .node rect, .node polygon, .node path { filter: drop-shadow(0 1px 2px rgba(15, 23, 42, .10)); }
      .node .label, .nodeLabel, .edgeLabel { font-weight: 500; }
      .edgeLabel rect { rx: 6px; ry: 6px; }
      .edgePath path { stroke-width: 1.5px; }
      .cluster rect { rx: 12px; ry: 12px; }
      .actor { rx: 9px; ry: 9px; filter: drop-shadow(0 1px 2px rgba(15, 23, 42, .10)); }
      .messageLine0, .messageLine1 { stroke-width: 1.4px; }
      .mindmap-node > rect, .mindmap-node > path, .mindmap-node > circle { rx: 11px; ry: 11px; filter: drop-shadow(0 1px 2px rgba(15, 23, 42, .10)); }
      .sectionTitle { font-weight: 600; }
    `,
  }

  let mermaidPromise = null
  let diagramSeq = 0
  let diagramObserver = null

  // 已渲染 SVG 的本地缓存：同一张图（同源码 + 同库版本 + 同渲染选项）只渲染一次，
  // 刷新/重进页面直接复用。localStorage 只有 ~5MB，因此限制条数并跳过超大图。
  const SVG_CACHE_PREFIX = 'dshagent_svg_'
  const SVG_CACHE_INDEX = 'dshagent_svg_index'
  const SVG_CACHE_MAX_ENTRIES = 40
  const SVG_CACHE_MAX_CHARS = 150 * 1024
  const MERMAID_RENDER_FINGERPRINT = `${MERMAID_ASSET}|strict|brand-v2`

  /** 供缓存键使用的短哈希（FNV-1a，纯前端同步计算，无需加密强度）。 */
  function hashKey(text) {
    let hash = 0x811c9dc5
    for (let i = 0; i < text.length; i++) {
      hash ^= text.charCodeAt(i)
      hash = Math.imul(hash, 0x01000193)
    }
    return (hash >>> 0).toString(36)
  }

  /** 读取某段 mermaid 源码已渲染好的 SVG（未缓存返回 null）。 */
  function svgCacheGet(source) {
    try { return localStorage.getItem(SVG_CACHE_PREFIX + hashKey(`${MERMAID_RENDER_FINGERPRINT}|${source}`)) } catch { return null }
  }

  /** 缓存渲染结果，按 LRU 索引淘汰最旧的条目；配额满/隐私模式时静默放弃。 */
  function svgCachePut(source, svg) {
    if (typeof svg !== 'string' || svg.length > SVG_CACHE_MAX_CHARS) return
    try {
      const key = SVG_CACHE_PREFIX + hashKey(`${MERMAID_RENDER_FINGERPRINT}|${source}`)
      localStorage.setItem(key, svg)
      const index = JSON.parse(localStorage.getItem(SVG_CACHE_INDEX) || '[]').filter(item => item !== key)
      index.push(key)
      while (index.length > SVG_CACHE_MAX_ENTRIES) {
        const stale = index.shift()
        if (stale) localStorage.removeItem(stale)
      }
      localStorage.setItem(SVG_CACHE_INDEX, JSON.stringify(index))
    } catch { /* 隐私模式或配额已满：跳过缓存，下次照常渲染 */ }
  }

  /** 懒加载 mermaid 库（同源相对路径，反代前缀自适应）；失败返回 null。 */
  function loadMermaid() {
    if (window.mermaid) return Promise.resolve(window.mermaid)
    if (mermaidPromise) return mermaidPromise
    mermaidPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script')
      script.src = MERMAID_ASSET
      script.onload = () => {
        if (!window.mermaid) { mermaidPromise = null; reject(new Error('mermaid not exposed')); return }
        // startOnLoad:false —— 由 renderDiagrams 精确控制渲染时机；
        // securityLevel:strict —— 模型输出一律当不可信内容，标签走净化。
        window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', ...MERMAID_THEME })
        resolve(window.mermaid)
      }
      script.onerror = () => { mermaidPromise = null; reject(new Error('mermaid load failed')) }
      document.head.appendChild(script)
    })
    return mermaidPromise
  }

  /**
   * 把 root 内还没渲染的 mermaid 块转成 SVG。渲染结果会按源码缓存（见
   * svgCacheGet/Put）：刷新时命中缓存就直接贴回 SVG，既不再加载 3.5MB 的库，
   * 也不重新解析布局。流式回答期间保持代码块（避免每个 delta 重排图），只在
   * 回答定稿（done / 断流恢复）时立即渲染；恢复历史时只渲染进入视口的图。
   * @param root - 待渲染的容器
   * @param options.lazy - true 时（历史恢复）交给 IntersectionObserver 按需渲染
   */
  async function renderDiagrams(root, options = {}) {
    if (!root) return
    const nodes = [...root.querySelectorAll('.mermaid-src:not([data-rendered])')]
    if (nodes.length === 0) return
    const misses = []
    for (const node of nodes) {
      const source = node.getAttribute('data-src') || ''
      const cached = svgCacheGet(source)
      if (cached !== null) {
        // 已经渲染过的图：直接复用，无需库、无需重新布局
        node.setAttribute('data-rendered', '1')
        node.innerHTML = cached
        node.classList.add('mermaid-done')
      } else {
        misses.push(node)
      }
    }
    if (misses.length === 0) return
    if (options.lazy && typeof IntersectionObserver === 'function') observeDiagrams(misses)
    else await renderMermaidNodes(misses)
  }

  /** 观察待渲染的图，进入视口（提前 300px）才真正渲染。 */
  function observeDiagrams(nodes) {
    if (!diagramObserver) {
      diagramObserver = new IntersectionObserver(entries => {
        const visible = entries.filter(entry => entry.isIntersecting).map(entry => entry.target)
        for (const node of visible) diagramObserver.unobserve(node)
        if (visible.length > 0) renderMermaidNodes(visible)
      }, { rootMargin: '300px 0px' })
    }
    for (const node of nodes) {
      node.setAttribute('data-rendered', '1')
      diagramObserver.observe(node)
    }
  }

  /** 真正调用 mermaid 渲染这些节点，并把结果写入缓存。 */
  async function renderMermaidNodes(nodes) {
    let lib
    try { lib = await loadMermaid() } catch { return /* 库拿不到：保留代码块 */ }
    for (const node of nodes) {
      if (node.classList.contains('mermaid-done')) continue
      const source = node.getAttribute('data-src') || ''
      try {
        const { svg } = await lib.render(`dsh-mmd-${++diagramSeq}`, source)
        node.innerHTML = svg
        node.classList.add('mermaid-done')
        svgCachePut(source, svg)
      } catch (err) {
        // 语法错误 / 渲染异常：保留原始代码块，控制台留证据
        console.warn('[guest] mermaid 渲染失败，保留代码块：', err && err.message)
      }
    }
  }

  // ── 图片阅读器（点击图片/图表放大查看）───────────────────────────────
  // 沿用团队既有实现（Readmdvue 浏览器插件 image-modal）：深色毛玻璃底 + 克隆
  // 内容居中 + 背景点击/ESC 关闭；访客场景再补缩放、平移、双指捏合与下载。
  const VIEWER_MIN = 0.5
  const VIEWER_MAX = 8
  const viewer = { el: null, stage: null, scale: 1, tx: 0, ty: 0, src: '', raster: false, pointers: new Map() }

  /** 按当前缩放/平移量刷新阅读器画面与比例提示。 */
  function applyViewerTransform() {
    if (!viewer.stage) return
    viewer.stage.style.transform = `translate(${viewer.tx}px, ${viewer.ty}px) scale(${viewer.scale})`
    const badge = viewer.el && viewer.el.querySelector('.viewer-scale')
    if (badge) badge.textContent = `${Math.round(viewer.scale * 100)}%`
  }

  /**
   * 以屏幕上某点为锚点缩放（该点在缩放前后保持不动）。锚点默认取视口中心。
   * @param factor - 相对倍率（>1 放大，<1 缩小）
   */
  function zoomViewer(factor, px, py) {
    if (!viewer.stage) return
    const next = Math.min(VIEWER_MAX, Math.max(VIEWER_MIN, viewer.scale * factor))
    if (next === viewer.scale) return
    const k = next / viewer.scale
    const rect = viewer.stage.getBoundingClientRect()
    const cx = rect.left + rect.width / 2
    const cy = rect.top + rect.height / 2
    const ox = px === undefined ? cx : px
    const oy = py === undefined ? cy : py
    // 中心点平移量：指针到中心的距离按 (1-k) 补偿，保证锚点像素不动
    viewer.tx += (1 - k) * (ox - cx)
    viewer.ty += (1 - k) * (oy - cy)
    viewer.scale = next
    applyViewerTransform()
  }

  /** 复位到 100% 且居中。 */
  function resetViewer() {
    viewer.scale = 1
    viewer.tx = 0
    viewer.ty = 0
    applyViewerTransform()
  }

  /** 关闭阅读器并解绑全局键盘监听。 */
  function closeViewer() {
    const el = viewer.el
    if (!el) return
    el.classList.remove('show')
    document.removeEventListener('keydown', viewer.onKey)
    document.body.style.overflow = viewer.prevOverflow || ''
    viewer.el = null
    viewer.stage = null
    viewer.pointers.clear()
    setTimeout(() => el.remove(), 250)
  }

  /**
   * 打开阅读器。图片走 <img>（可下载/新窗口打开）；已渲染的 mermaid 图表
   * 直接克隆 SVG 节点，缩放到原尺寸查看。
   * @param node - 聊天区里被点击的 <img> 或图表容器
   */
  function openViewer(node) {
    if (viewer.el) { closeViewer(); return } // 再点一次即切换关闭
    const isRaster = node.tagName === 'IMG'
    const source = isRaster ? node : node.querySelector('svg')
    if (!source) return

    const el = document.createElement('div')
    el.className = 'viewer'
    const stage = document.createElement('div')
    stage.className = 'viewer-stage'
    let content
    if (isRaster) {
      content = document.createElement('img')
      content.src = node.currentSrc || node.src
      content.alt = node.alt || ''
      content.draggable = false
      // 取不到的图在深色底上只会留一个白点占位：直接给出可读提示
      content.addEventListener('error', () => {
        stage.classList.add('broken')
        stage.setAttribute('data-fallback', `${t('imageUnavailable')}\n${viewer.src}`)
      })
      viewer.src = content.src
    } else {
      content = source.cloneNode(true)
      // 只带 viewBox 的 SVG 没有固有尺寸，放进阅读器会塌成 12x12 的小白点
      // （实测：内联 738x331 → 阅读器 12x12）。这里用 viewBox 尺寸补回固有宽高，
      // 再由 CSS 的 max-width/max-height 等比缩到视口内。
      const box = (content.getAttribute('viewBox') || '').trim().split(/[\s,]+/).filter(Boolean).map(Number)
      if (box.length === 4 && box[2] > 0 && box[3] > 0) {
        content.setAttribute('width', String(box[2]))
        content.setAttribute('height', String(box[3]))
      } else {
        const rect = source.getBoundingClientRect()
        content.setAttribute('width', String(Math.max(1, Math.round(rect.width))))
        content.setAttribute('height', String(Math.max(1, Math.round(rect.height))))
      }
      // 去掉 mermaid 自带的 max-width 内联样式（其它内联样式保留），尺寸交给阅读器 CSS
      const inlineStyle = content.getAttribute('style') || ''
      content.setAttribute('style', inlineStyle.replace(/max-width\s*:[^;]+;?/i, ''))
      content.setAttribute('preserveAspectRatio', 'xMidYMid meet')
      viewer.src = ''
    }
    stage.appendChild(content)
    el.appendChild(stage)

    const bar = document.createElement('div')
    bar.className = 'viewer-bar'
    const buttons = [
      { glyph: '＋', label: t('viewerZoomIn'), act: () => zoomViewer(1.25) },
      { glyph: '－', label: t('viewerZoomOut'), act: () => zoomViewer(0.8) },
      { glyph: '⟲', label: t('viewerReset'), act: () => resetViewer() },
    ]
    if (viewer.src) {
      buttons.push({ glyph: '⤢', label: t('viewerOpenTab'), act: () => window.open(viewer.src, '_blank', 'noopener') })
      buttons.push({ glyph: '⤓', label: t('viewerDownload'), act: () => downloadViewerImage() })
    }
    buttons.push({ glyph: '✕', label: t('viewerClose'), act: () => closeViewer() })
    for (const item of buttons) {
      const button = document.createElement('button')
      button.type = 'button'
      button.textContent = item.glyph
      button.title = item.label
      button.setAttribute('aria-label', item.label)
      button.addEventListener('click', event => { event.stopPropagation(); item.act() })
      bar.appendChild(button)
    }
    el.appendChild(bar)

    const badge = document.createElement('div')
    badge.className = 'viewer-scale'
    el.appendChild(badge)

    el.addEventListener('click', event => { if (event.target === el) closeViewer() }) // 点背景关闭
    // 滚轮缩放（锚点跟随指针）：passive:false 才能 preventDefault 阻止页面滚动
    el.addEventListener('wheel', event => {
      event.preventDefault()
      zoomViewer(Math.exp(-event.deltaY * 0.0015), event.clientX, event.clientY)
    }, { passive: false })
    // 双击：在 100% 与 200% 之间切换
    stage.addEventListener('dblclick', event => {
      event.preventDefault()
      if (viewer.scale > 1) resetViewer()
      else zoomViewer(2, event.clientX, event.clientY)
    })
    // 指针事件统一处理鼠标拖拽平移与触摸双指捏合
    el.addEventListener('pointerdown', onViewerPointerDown)
    el.addEventListener('pointermove', onViewerPointerMove)
    el.addEventListener('pointerup', onViewerPointerUp)
    el.addEventListener('pointercancel', onViewerPointerUp)
    viewer.onKey = event => {
      if (event.key === 'Escape') closeViewer()
      else if (event.key === '+' || event.key === '=') zoomViewer(1.25)
      else if (event.key === '-' || event.key === '_') zoomViewer(0.8)
      else if (event.key === '0') resetViewer()
    }
    document.addEventListener('keydown', viewer.onKey)

    viewer.el = el
    viewer.stage = stage
    viewer.scale = 1
    viewer.tx = 0
    viewer.ty = 0
    viewer.prevOverflow = document.body.style.overflow
    document.body.style.overflow = 'hidden' // 阅读时锁住背景滚动
    applyViewerTransform()
    document.body.appendChild(el)
    requestAnimationFrame(() => el.classList.add('show'))
  }

  /** 阅读器里的图片下载（沿用原始文件名）。 */
  function downloadViewerImage() {
    if (!viewer.src) return
    const link = document.createElement('a')
    link.href = viewer.src
    link.download = decodeURIComponent(viewer.src.split('/').pop() || 'image')
    document.body.appendChild(link)
    link.click()
    link.remove()
  }

  /** 拖拽平移 / 双指捏合：全部用指针事件，桌面与移动端同一套代码。 */
  function onViewerPointerDown(event) {
    if (!viewer.stage) return
    viewer.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY })
    viewer.stage.classList.add('dragging')
  }

  function onViewerPointerMove(event) {
    const tracked = viewer.pointers.get(event.pointerId)
    if (!tracked || !viewer.stage) return
    const points = [...viewer.pointers.values()]
    if (viewer.pointers.size === 1) {
      // 单指/鼠标：平移
      viewer.tx += event.clientX - tracked.x
      viewer.ty += event.clientY - tracked.y
      tracked.x = event.clientX
      tracked.y = event.clientY
      applyViewerTransform()
      return
    }
    // 双指：按下两指间距的比例缩放，锚点取两指中点
    const other = points.find(p => p !== tracked)
    const previous = Math.hypot(tracked.x - other.x, tracked.y - other.y)
    tracked.x = event.clientX
    tracked.y = event.clientY
    const current = Math.hypot(tracked.x - other.x, tracked.y - other.y)
    if (previous > 0 && current > 0) {
      zoomViewer(current / previous, (tracked.x + other.x) / 2, (tracked.y + other.y) / 2)
    }
  }

  function onViewerPointerUp(event) {
    viewer.pointers.delete(event.pointerId)
    if (viewer.stage && viewer.pointers.size === 0) viewer.stage.classList.remove('dragging')
  }

  // 事件委托：聊天区里点图片或已渲染的图表 → 打开阅读器
  chatEl.addEventListener('click', event => {
    const target = event.target
    if (!(target instanceof Element)) return
    const image = target.closest('.bubble img')
    if (image) { event.preventDefault(); openViewer(image); return }
    const diagram = target.closest('.bubble .mermaid-src.mermaid-done')
    if (diagram) { event.preventDefault(); openViewer(diagram) }
  })

  // 事件委托：HTML 预览的"查看源码 / 收起源码"切换
  chatEl.addEventListener('click', event => {
    const target = event.target
    if (!(target instanceof Element)) return
    const toggle = target.closest('.html-src-toggle')
    if (!toggle) return
    const block = toggle.closest('.html-block')
    const source = block && block.querySelector('.html-src')
    if (!source) return
    source.hidden = !source.hidden
    toggle.textContent = source.hidden ? t('htmlSource') : t('htmlSourceHide')
  })

  // 图片加载失败（源站已删图 / 网络不通）：降级为文字提示，避免破图图标
  chatEl.addEventListener('error', event => {
    const target = event.target
    if (!(target instanceof HTMLImageElement)) return
    const figure = target.closest('.kb-image')
    if (!figure) return
    figure.classList.add('broken')
    figure.setAttribute('data-fallback', t('imageUnavailable'))
  }, true)

  function addMessage(role, html, sources) {
    if (welcomeEl) welcomeEl.hidden = true
    const restoring = document.getElementById('restoring')
    if (restoring) restoring.hidden = true
    const msg = document.createElement('div')
    msg.className = `msg ${role}`
    const avatar = document.createElement('div')
    avatar.className = 'avatar'
    avatar.textContent = role === 'user' ? t('userLabel') : t('aiLabel')
    const bubble = document.createElement('div')
    bubble.className = 'bubble'
    bubble.innerHTML = html
    msg.appendChild(avatar)
    msg.appendChild(bubble)
    if (sources && sources.length) {
      const src = document.createElement('div')
      src.className = 'sources'
      src.innerHTML = sources.map(s => `<span>📄 ${esc(s)}</span>`).join('')
      bubble.appendChild(src)
    }
    chatEl.appendChild(msg)
    chatEl.scrollTop = chatEl.scrollHeight
    return msg
  }

  async function ensureSession() {
    if (sessionId) return sessionId
    setStatus('connecting')
    const res = await fetch(`${API_BASE}/api/guest/session`, { method: 'POST' })
    if (!res.ok) throw new Error('create session failed')
    const data = await res.json()
    saveSession(data.sessionId)
    setStatus('online')
    return sessionId
  }

  /** Restore a previous conversation (same browser, after refresh) from the server. */
  async function restoreHistory() {
    if (!sessionId) return
    // Show a restoring animation while history loads so the visitor is not
    // staring at a blank chat during the fetch.
    const restoringEl = document.getElementById('restoring')
    welcomeEl.hidden = true
    restoringEl.hidden = false
    try {
      const res = await fetch(`${API_BASE}/api/guest/history?sessionId=${encodeURIComponent(sessionId)}`)
      if (!res.ok) {
        // 400 (malformed) and 404 (session gone on the server) both mean the
        // stored session id is unusable: drop it and start a fresh one. Only
        // genuine server/network errors keep the id so chat can retry.
        if (res.status === 400 || res.status === 404) {
          localStorage.removeItem('dshagent_session')
          sessionId = null
        }
        return
      }
      const data = await res.json()
      const messages = data.messages || []
      if (messages.length === 0) return
      setStatus('online')
      for (const m of messages) {
        if (m.role === 'assistant') {
          addMessage('assistant', renderMarkdown(m.text))
        } else {
          addMessage('user', renderMarkdown(m.text))
        }
      }
      renderDiagrams(chatEl, { lazy: true })
    } catch { /* offline / server restarted: keep session id, chat will resume it */ }
    finally {
      // addMessage removes welcome; if nothing was restored, show the
      // welcome hero again.
      restoringEl.hidden = true
      const hasMessages = chatEl.querySelector('.msg') !== null
      if (!hasMessages) welcomeEl.hidden = false
    }
  }

  /**
   * Parse one SSE stream from a fetch Response, calling handlers per event.
   * Watchdog: the free ngrok tunnel sometimes opens the SSE response but then
   * stops forwarding frames (no data, no FIN) — a blocked reader.read() would
   * otherwise hang forever and the spinner would spin indefinitely. Each read
   * races a 30s timer; a stall throws and send() recovers the persisted reply
   * from history.
   * @param res - fetch Response whose body is an SSE stream.
   * @param onEvent - per-frame handler `(event, data)`.
   */
  async function consumeSse(res, onEvent) {
    if (!res.body) throw new Error('no stream body')
    const reader = res.body.getReader()
    const decoder = new TextDecoder()
    // Tunnel stall detection: ngrok's free tier sometimes opens the SSE
    // response then never delivers another frame (no data, no FIN). A normal
    // turn starts producing frames within ~10s (reasoning is filtered out, so
    // the first visible frame may lag a few seconds behind the model start).
    // If no frame arrives within 25s of the previous one the tunnel is dead.
    const stallMs = 25000
    let buffer = ''
    while (true) {
      // Race the read against a stall timer: ngrok (free tunnel) occasionally
      // holds the connection open without delivering frames, so read() alone
      // never resolves. Throw so send() can fall back to history recovery.
      let chunk
      try {
        chunk = await Promise.race([
          reader.read(),
          new Promise((_, reject) => setTimeout(() => reject(new Error('stream stalled')), stallMs)),
        ])
      } catch (err) {
        // Do NOT await reader.cancel(): on a tunnel that stopped forwarding
        // frames, cancel() itself can hang. Fire it and surface the stall.
        reader.cancel().catch(() => { /* best-effort */ })
        throw err
      }
      if (chunk.done) break
      buffer += decoder.decode(chunk.value, { stream: true })
      // SSE frames are separated by a blank line
      let idx
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const frame = buffer.slice(0, idx)
        buffer = buffer.slice(idx + 2)
        let event = 'message'
        let data = ''
        for (const line of frame.split('\n')) {
          if (line.startsWith('event:')) event = line.slice(6).trim()
          else if (line.startsWith('data:')) data += line.slice(5).trim()
        }
        if (data) {
          let parsed
          try { parsed = JSON.parse(data) } catch { parsed = { raw: data } }
          onEvent(event, parsed)
        }
      }
    }
  }

  /**
   * Recover a reply after a dropped stream: poll the server history until the
   * assistant answer following our message appears (the server keeps running
   * the turn even when the SSE connection dies). Gives up after ~20s so a
   * genuinely failed request surfaces as an error instead of an endless wait.
   * @param text - the exact user message whose reply we are waiting for.
   */
  async function recoverReply(text) {
    const deadline = Date.now() + 20000
    let first = true
    while (Date.now() < deadline) {
      if (!first) await new Promise(r => setTimeout(r, 1200))
      first = false
      try {
        const res = await fetch(`${API_BASE}/api/guest/history?sessionId=${encodeURIComponent(sessionId)}`)
        if (!res.ok) continue
        const data = await res.json()
        const messages = data.messages || []
        // Find the newest assistant message that answers this exact question
        // (the last matching user message, then the assistant text after it).
        let found = null
        for (let i = messages.length - 1; i >= 0; i--) {
          if (messages[i].role === 'user' && messages[i].text === text) {
            found = i
            break
          }
        }
        if (found !== null) {
          const next = messages[found + 1]
          if (next && next.role === 'assistant' && next.text) {
            return { text: next.text, sources: next.sources }
          }
        }
      } catch { /* server restarting / offline: keep polling */ }
    }
    return null
  }

  async function send() {
    const text = inputEl.value.trim()
    if (!text) return
    inputEl.value = ''
    addMessage('user', renderMarkdown(text))
    // 流式消息气泡：先显示"正在查询"动画，收到首个内容后替换为回答
    const bubbleHost = document.createElement('div')
    bubbleHost.className = 'msg assistant'
    const avatar = document.createElement('div')
    avatar.className = 'avatar'
    avatar.textContent = t('aiLabel')
    const bubble = document.createElement('div')
    bubble.className = 'bubble'
    bubble.innerHTML = `<span class="waiting"><span class="spinner-sm"></span>${t('waiting')}</span>`
    bubbleHost.appendChild(avatar)
    bubbleHost.appendChild(bubble)
    chatEl.appendChild(bubbleHost)
    chatEl.scrollTop = chatEl.scrollHeight
    sendEl.disabled = true
    // State read by the catch block below — must live OUTSIDE the try block
    // (let is block-scoped, so declarations inside try are invisible to catch).
    let streamed = ''
    let sources = []
    let done = false
    let streamError = null
    /** Replace the waiting indicator with real content on the first delta. */
    function showStreamed() {
      bubble.innerHTML = renderMarkdown(streamed)
      chatEl.scrollTop = chatEl.scrollHeight
    }
    try {
      const id = await ensureSession()
      // Hard deadline for the whole request: if ngrok never delivers headers
      // OR stalls mid-stream, aborting the fetch guarantees the catch path
      // runs (and recovers the persisted reply) instead of spinning forever.
      const controller = new AbortController()
      const hardDeadline = setTimeout(() => controller.abort(), 45000)
      let res
      try {
        res = await fetch(`${API_BASE}/api/guest/chat/stream`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ sessionId: id, message: text }),
          signal: controller.signal,
        })
      } finally {
        clearTimeout(hardDeadline)
      }
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}))
        // Blocked/rate-limited responses carry a user-facing message
        // (e.g. the calm-down notice); prefer it over the raw error code.
        throw new Error(errData.message || errData.error || `request failed (${res.status})`)
      }
      await consumeSse(res, (event, data) => {
        if (event === 'meta' && typeof data.version === 'string') {
          // Handshake frame: stamp the server build onto the badge.
          if (svcVerEl) svcVerEl.textContent = `前端 ${APP_VERSION} · 服务 ${data.version}`
        } else if (event === 'notice' && typeof data.text === 'string') {
          // Friendly reminder from the moderation layer (first-offence
          // warning): shown above the reply, never blocks the answer.
          const tip = document.createElement('div')
          tip.className = 'msg notice'
          const tipBubble = document.createElement('div')
          tipBubble.className = 'bubble'
          tipBubble.textContent = data.text
          tip.appendChild(tipBubble)
          chatEl.insertBefore(tip, bubbleHost)
        } else if (event === 'delta' && typeof data.text === 'string') {
          const first = streamed === ''
          streamed += data.text
          if (first) showStreamed()
          else {
            bubble.innerHTML = renderMarkdown(streamed)
            chatEl.scrollTop = chatEl.scrollHeight
          }
        } else if (event === 'sources' && Array.isArray(data.sources)) {
          sources = data.sources
        } else if (event === 'done') {
          done = true
          if (typeof data.reply === 'string' && data.reply) {
            streamed = data.reply
            showStreamed()
          }
          sources = data.sources || sources
          if (sources.length) {
            const src = document.createElement('div')
            src.className = 'sources'
            src.innerHTML = sources.map(s => `<span>📄 ${esc(s)}</span>`).join('')
            bubble.appendChild(src)
          }
          renderDiagrams(bubble)
        } else if (event === 'error') {
          streamError = data.error || 'turn failed'
        }
      })
      if (streamError) throw new Error(streamError)
      if (!done && !streamed) throw new Error('stream ended without reply')
    } catch (err) {
      // The stream dropped or stalled (proxy timeout / flaky mobile network /
      // ngrok tunnel blip). The server turn usually still finishes and
      // persists the reply, so recover it from history instead of showing a
      // bare error: switch the bubble to a "recovering" state, poll history
      // until the reply for this message appears, then render it.
      const aborted = err && (err.name === 'AbortError' || /stalled|abort/i.test(String(err.message || '')))
      const isNetworkDrop = !done || aborted || /network|fetch|load failed|ended without/i.test(String(err.message || ''))
      if (isNetworkDrop && sessionId) {
        bubble.innerHTML = `<span class="waiting"><span class="spinner-sm"></span>${t('recovering')}</span>`
        const reply = await recoverReply(text)
        if (reply) {
          bubble.innerHTML = renderMarkdown(reply.text)
          if (reply.sources && reply.sources.length) {
            const src = document.createElement('div')
            src.className = 'sources'
            src.innerHTML = reply.sources.map(s => `<span>📄 ${esc(s)}</span>`).join('')
            bubble.appendChild(src)
          }
          chatEl.scrollTop = chatEl.scrollHeight
          renderDiagrams(bubble)
        } else {
          // Genuine failure (or the server never got the message): show it.
          bubble.innerHTML = `<p>${t('errorGeneric')}${esc(err.message)}</p>`
        }
      } else {
        // Show the error in place of the waiting animation.
        bubble.innerHTML = `<p>${t('errorGeneric')}${esc(err.message)}</p>`
      }
    } finally {
      sendEl.disabled = false
      inputEl.focus()
    }
  }

  sendEl.addEventListener('click', send)
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() }
  })
  // Auto-grow input
  inputEl.addEventListener('input', () => { inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px' })
  // Restore the previous conversation on refresh, then ensure a live session.
  paintServerVersion()
  restoreHistory().finally(() => {
    ensureSession().catch(() => { setStatus('offline') })
  })
})()
</script>
</body>
</html>
