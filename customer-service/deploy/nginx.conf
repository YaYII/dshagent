# dshagent 客服系统 — nginx 入口（游客 / Admin 双端口）
#
# 知识库图片缓存区：vault 里的图片是源站绝对路径 /uploads/xxx.png（镜像自
# www.cem-macau.com），游客端 /uploads/ 回源取图后落盘缓存，避免每次回源。
proxy_cache_path /var/cache/nginx/uploads levels=1:2 keys_zone=uploads_cache:10m max_size=200m inactive=30d use_temp_path=off;
#
# 容器内两端口（compose 映射到宿主 10000+ 段）：
#   :8080 = Guest 游客对话页（静态 + /api/guest JSON API）
#   :8081 = Admin 管理端（官方 DSH Web GUI 全量反代，含 token 鉴权）
#
# dsh web 只绑 127.0.0.1:3080（官方安全设计），nginx 与 dsh 共享网络命名
# 空间（compose network_mode: service:dsh-agent），经 127.0.0.1 反代。
# Admin 的 token 握手由官方 Web UI 自身完成（启动 URL ?token=... 见日志）。

# ── 游客端口：静态聊天页 + guest JSON API ─────────────────────────────────
server {
    listen 8080;  # 容器内固定；宿主 10800 → 8080（compose 映射）
    server_name _;

    # 游客聊天页（静态单文件）。no-cache：页面 JS 内含断流自愈等修复，
    # 必须确保访客每次拿到最新版（否则 304 缓存旧 JS 会导致转圈不恢复）。
    location = / {
        root /srv/guest;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    location /guest {
        alias /srv/guest;
        try_files $uri $uri/ /guest/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    # 静态资源（Mermaid 图表库等）。文件名带版本号，内容不变即可长缓存；
    # 回答里出现 ```mermaid 时前端才懒加载，平时访客不会下载这 3.5MB。
    location /assets/ {
        root /srv/guest;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # 知识库图片：/uploads/* 回源澳電官网并落盘缓存。访客从本服务同源取图，
    # https 页面下不会触发混合内容拦截，且重复访问直接吃缓存。
    location /uploads/ {
        proxy_pass https://www.cem-macau.com/uploads/;
        proxy_ssl_server_name on;
        proxy_set_header Host www.cem-macau.com;
        proxy_set_header Referer https://www.cem-macau.com/;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; dshagent-cs/1.0)";
        proxy_cache uploads_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        # 丢掉源站的缓存头，只保留本服务自己的策略（避免两个 Cache-Control 冲突）
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        # 图片文件名自带内容哈希（如 tos_bg_d37ae335dd.png），可长缓存
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Image-Cache $upstream_cache_status;
    }
    # 游客 JSON API → guest-server 插件（/api/guest/* 挂在 dsh web 3080）
    location /api/guest/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # SSE 流式（chat/stream 打字机回答）：nginx 默认 proxy_buffering on
        # 会攒住增量帧直到上游结束，访客迟迟收不到首字节，链路空闲超时即
        # 断开 → 前端 "network error"（实测：meta 84B 后连接被掐断）。
        proxy_buffering off;
        proxy_cache off;
    }
    # 游客端口不暴露 Admin/官方任何其它路径
    location / {
        return 404;
    }
}

# ── Admin 端口：官方 DSH Web GUI（根路径反代，无前缀错位问题）──────────────
server {
    listen 8081;  # 容器内固定；宿主 10801 → 8081（compose 映射）
    server_name _;

    # 官方 Web GUI 全量（含 SSE/WS 升级）
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        # Host 必须带端口。DSH 的 /api 信任栅栏（packages/client/connection/
        # src/api-request-trust.ts）要求浏览器带上的 Origin 与 Host **精确同源**：
        # 浏览器的 Origin 是 http://<host>:<port>，而 nginx 的 $host 会剥掉端口，
        # 于是 127.0.0.1 != 127.0.0.1:10801 → 全部 /api 请求 403（页面外壳能打开，
        # 看起来「登录成功」，但会话列表、Cordis 清单、WebSocket 全挂，控制台刷
        # 403）。$http_host 保留原始 Host 头（含端口），与 Origin 一致。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;  # SSE 流式
    }
}
