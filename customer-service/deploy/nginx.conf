# dshagent 客服系统 — nginx 入口（游客 / Admin 双端口）
#
# 容器内两端口（compose 映射到宿主 10000+ 段）：
#   :8080 = Guest 游客对话页（静态 + /api/guest JSON API）
#   :8081 = Admin 管理端（官方 DSH Web GUI 全量反代，含 token 鉴权）
#
# dsh web 只绑 127.0.0.1:3080（官方安全设计），nginx 与 dsh 共享网络命名
# 空间（compose network_mode: service:dsh-agent），经 127.0.0.1 反代。
# Admin 的 token 握手由官方 Web UI 自身完成（启动 URL ?token=... 见日志）。

# ── 游客端口：静态聊天页 + guest JSON API ─────────────────────────────────
server {
    listen 8080;  # 容器内固定；宿主 10800 → 8080（compose 映射）
    server_name _;

    # 游客聊天页（静态单文件）
    location = / {
        root /srv/guest;
        try_files /index.html =404;
    }
    location /guest {
        alias /srv/guest;
        try_files $uri $uri/ /guest/index.html;
    }
    # 游客 JSON API → guest-server 插件（/api/guest/* 挂在 dsh web 3080）
    location /api/guest/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    # 游客端口不暴露 Admin/官方任何其它路径
    location / {
        return 404;
    }
}

# ── Admin 端口：官方 DSH Web GUI（根路径反代，无前缀错位问题）──────────────
server {
    listen 8081;  # 容器内固定；宿主 10801 → 8081（compose 映射）
    server_name _;

    # 官方 Web GUI 全量（含 SSE/WS 升级）
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;  # SSE 流式
    }
}
