# dshagent 客服系统 — nginx 入口
#
# 对外单端口 8080：
#   /            → Guest 游客对话页（静态） + /api/guest 反代到 dsh web
#   /admin       → Admin 管理端（官方 DSH Web GUI，含 token 鉴权）
#
# dsh web 只绑 127.0.0.1:3080（官方安全设计），本 nginx 与 dsh 同容器网络。

# 管理员访问令牌从容器环境注入（DSH_ADMIN_TOKEN），首次访问 /admin 会
# 302 到 /admin/?token=... 完成握手。客服 profile 启动 URL 的 token 由
# dsh 生成并打印到日志；部署脚本将其写入 /run/dsh-token 供本配置读取。
# （简化：直接反代，token 握手由 dsh web 的 /admin 页面自身完成。）

server {
    listen 8080;
    server_name _;

    # ── Guest 游客端：静态页 + JSON API ──────────────────────────────────
    location = / {
        root /srv/guest;
        try_files /index.html =404;
    }
    location /guest {
        alias /srv/guest;
        try_files $uri $uri/ /guest/index.html;
    }
    # Guest JSON API → dsh web（guest-server 插件注册 /api/guest/*）
    location /api/guest/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Admin 管理端：官方 DSH Web GUI ────────────────────────────────────
    location /admin/ {
        proxy_pass http://127.0.0.1:3080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    # 根 /api（非 guest）→ Admin 的官方浏览器连接
    location /api/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Admin SPA 深度路由回退
    location /admin {
        proxy_pass http://127.0.0.1:3080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
