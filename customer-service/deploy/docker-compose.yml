# dshagent 客服系统 — docker compose
#
# 单机部署：一个 dsh-agent 服务容器（官方内核 + 客服 preset + guest 桥）
# + 一个 nginx 入口容器。游客与 Admin 走**两个独立端口**：
#   :10800 = Guest 游客对话页（静态 + /api/guest）
#   :10801 = Admin 管理端（官方 DSH Web GUI，token 见 dsh 日志）
# Obsidian 知识库 vault 目录只读挂载为 /kb，编辑 vault 即更新客服知识。
#
# 使用：
#   cp .env.example .env   # 填模型 API key
#   docker compose up -d --build
#   访问 http://<host>:10800/        （游客端）
#   访问 http://<host>:10801/        （管理端）

services:
  dsh-agent:
    build:
      context: ../..
      dockerfile: customer-service/deploy/Dockerfile
    container_name: dshagent-app
    env_file: .env
    environment:
      DSH_HOME: /dsh-home
      # 模型路由静态配置（profile patch 读此 env 注入 llm-pi-ai provider）
      AGENTROUTER_API_KEY: ${AGENTROUTER_API_KEY:-}
      CMD_API_KEY: ${CMD_API_KEY:-}
      CMD_API_KEY_2: ${CMD_API_KEY_2:-}
      NOOCOOL_API_KEY: ${NOOCOOL_API_KEY:-}
      # 本地 LLM 中转（LiteLLM 网关，宿主 127.0.0.1:4000）的 master key。
      # 网关把 Command Code / AgentRouter / NooCool 多上游聚合成一个
      # OpenAI 兼容端点，profile 里以 provider `litellm` +
      # baseURL http://llm-gateway:4000/v1 接入（见 cordis.patch.yml）。
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    volumes:
      # 客服知识库（Obsidian vault 目录，只读）
      - ${KB_VAULT_DIR:-./kb}:/kb:ro
      # DSH 持久化数据（settings/credentials/sessions/…）
      - dsh-home:/dsh-home
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/api/guest/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      # 游客端口（nginx :8080）与 Admin 端口（nginx :8081）都在 dsh-agent
      # 的 netns 上发布（nginx 是 network_mode: service:dsh-agent）。
      - "${GUEST_PORT:-10800}:8080"
      - "${ADMIN_PORT:-10801}:8081"
    restart: unless-stopped
    networks:
      - dshagent
      # 与本地 LiteLLM 网关共享的用户自定义网络：按容器名访问
      # http://llm-gateway:4000。不能走 host.docker.internal —— 网关只把
      # 4000 发布到宿主回环（-p 127.0.0.1:4000:4000），回环地址在容器里
      # 不可达；而 Docker 默认 bridge 网络不做容器名解析，所以必须用
      # 用户自定义网络（由 `llm-gateway start` 创建/挂载，见该脚本 NETWORK）。
      - llm-shared
    extra_hosts:
      # 让容器内 profile 的 agentrouter baseURL（host.docker.internal:8787）
      # 能访问宿主机上运行的 AgentRouter 网关
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.27-alpine
    container_name: dshagent-nginx
    depends_on:
      - dsh-agent
    # 共享 dsh-agent 的网络命名空间：dsh web 只绑容器内 127.0.0.1:3080
    # （官方安全设计拒绝 0.0.0.0），nginx 与 dsh 同 netns 才能反代到它。
    network_mode: "service:dsh-agent"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/guest:/srv/guest:ro
    restart: unless-stopped

volumes:
  dsh-home:

networks:
  dshagent:
    driver: bridge
  # 本地 LiteLLM 网关所在的共享网络（`llm-gateway start` 创建）。声明为
  # external：由网关侧管理生命周期，客服 compose 只接入、不创建/销毁，
  # 避免 `docker compose down` 把网关的网络一起拆掉。
  llm-shared:
    external: true
