# dshagent 客服系统 — 客服 profile 组合层
#
# 叠加在官方 bundle 层之上（@deepseek-ai/dsh-base → @deepseek-ai/dsh-web-app）。
# 裁剪策略：本 profile 不装任何第三方业务 bundle（agiteam/任务板/团队编排/
# Office/PPT/搜索等），只保留官方内核 + Web GUI。第三方裁剪 = profile
# package.json 的 bundles 列表（见本目录 package.json）。
#
# patch 语义：id 命中的行「整行 config 替换」，因此只 restate 必须改的键，
# 其余官方默认全部保留（官方 web-app 已把 agent-plane 工具移入 preset）。
#
# 客服专属 host 插件以绝对路径插入。路径在部署时固定为容器内
# /app/customer-service/...；本地开发用 dsh 源码根目录（见 install.sh
# 生成的 profile 覆盖）。

# ── 会话默认 preset：客服助手 ──────────────────────────────────────────────
# 客服系统默认会话使用知识库驱动的客服助手 preset（工具受限，无代码执行）。
- id: agent-presets
  config:
    default: customer-service

# ── 日志导出器（可观测性基础设施）──────────────────────────────────────────
# 官方各 bundle 都不含日志导出器，未挂载时 `ctx.logger.*` 全部静默丢弃——门禁的
# 留痕（guest.output-gate …）与「门禁未生效」告警都会消失，运维无从判断门禁是否
# 在跑。这里挂官方 console 导出器，把 warn 级以上的记录输出到容器 stdout
# （docker logs 可见）。行序无关，但必须存在。
- insert:
    - id: logger-console
      name: '@deepseek-ai/cordis-plugin-logger-console'
      config:
        colors: false
        # 默认级别只放行 error，会让门禁留痕（warn）与「门禁未生效」告警全部沉底。
        # 3 = debug，即输出全部级别；容器日志由 docker logs 采集。
        levels:
          default: 3
        showTime: ''

# ── 模型路由（客服部署自带默认 provider）────────────────────────────────────
# llm-pi-ai 行级静态 providers：部署通过环境变量注入 apiKey（见 docker-compose
# 的 env_file）。Admin 仍可在设置页覆盖/新增 provider；此处提供容器开箱即用的
# 默认路由（agentrouter 网关或直连均可，按部署填 baseURL/apiKeyEnv）。
- id: llm-pi-ai
  config:
    providers:
      agentrouter:
        displayName: AgentRouter
        api: openai-completions
        apiKeyEnv: AGENTROUTER_API_KEY
        baseURL: http://host.docker.internal:8787/v1
        compat:
          supportsDeveloperRole: false
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 1000000
            maxTokens: 384000
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              max: max

      commandcode:
        displayName: Command Code
        api: openai-completions
        apiKeyEnv: CMD_API_KEY_2
        baseURL: https://api.commandcode.ai/provider/v1
        compat:
          supportsDeveloperRole: false
        models:
          # 客服默认模型：V4.1 Flash。旧的 V4 Flash 条目保留，改 agent-default-model
          # 的 model 一行即可回滚（中转同时提供两者，实测均可用）。
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 384000
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              max: max
          - id: deepseek/deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 1000000
            maxTokens: 384000
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              max: max

      noocool:
        displayName: NooCool
        api: openai-completions
        apiKeyEnv: NOOCOOL_API_KEY
        baseURL: https://newapi.noo.cool/v1
        compat:
          supportsDeveloperRole: false
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 1000000
            maxTokens: 384000
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              max: max

      # ── 本地 LLM 中转（LiteLLM 网关，宿主 127.0.0.1:4000）──────────────
      # 网关把 Command Code / AgentRouter / NooCool 多家上游聚合成一个 OpenAI
      # 兼容端点；同一 model_name 挂多个上游时自动分流+故障转移（网关
      # config.yaml 的 routing_strategy: simple-shuffle）。对客服系统的价值：
      # 某家额度用尽或被熔断时自动切下一家，访客不会因此拿到「暂时无法回答」。
      #
      # 地址用容器名而非宿主：网关只把 4000 发布到宿主回环
      # （-p 127.0.0.1:4000:4000），容器里 host.docker.internal 到不了；两个
      # 容器共享 llm-shared 用户自定义网络，按容器名 llm-gateway 解析
      # （见 docker-compose.yml 的 networks 与 llm-gateway 脚本的 NETWORK）。
      # 密钥走 LITELLM_MASTER_KEY（compose env_file 注入，不写进本文件）。
      litellm:
        displayName: 本地 LLM 中转 (LiteLLM)
        api: openai-completions
        apiKeyEnv: LITELLM_MASTER_KEY
        baseURL: http://llm-gateway:4000/v1
        compat:
          supportsDeveloperRole: false
        models:
          # 网关暴露的 model_name，与直连 commandcode 时用的模型名相同，
          # 因此切换 provider 不需要改 preset 或其它配置。
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (via LiteLLM)
            contextWindow: 1000000
            maxTokens: 384000
            reasoningEfforts:
              # 与上游实测一致：off 会被网关以 400 拒绝，故 off 映射成 null
              # （不下发 reasoning_effort 字段），其余原样透传。
              off: null
              low: low
              medium: medium
              high: high
              max: max
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (LiteLLM 短名)
            contextWindow: 1000000
            maxTokens: 384000
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              max: max
          # ── 免费/低成本档：用于「免费模型能不能正常干活」的实测 ────────────
          # 两者都实测可用（普通问答 + 工具调用 finish=tool_calls、参数正确），
          # 且在 Admin 的模型选择器里可直接切换，用于与付费档对比。
          # 注意：它们同样**强制思考**——实测给 80 token 时推理段就吃光配额、
          # 正文为空（finish=length）；给 700 token 才稳定出正文。
          # 因此任何按「不思考模型」估算的小 max_tokens 都会失败。
          - id: ar/deepseek-v4-flash
            name: DeepSeek V4 Flash (免费档 · AgentRouter)
            contextWindow: 1000000
            maxTokens: 384000
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              max: max
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash (网关聚合名)
            contextWindow: 1000000
            maxTokens: 384000
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              max: max
          - id: ds/deepseek-v4-pro
            name: DeepSeek V4 Pro (via LiteLLM)
            contextWindow: 1000000
            maxTokens: 384000
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              max: max

# ── 会话默认模型指向上面注册的路由 ─────────────────────────────────────────
# 默认走本地 LLM 中转（provider litellm → http://llm-gateway:4000/v1）：同一
# 模型名在网关侧挂多家上游，某家额度用尽/被熔断时自动切下一家，客服不会因此
# 中断。回滚到直连只需把下面两行改回 provider: commandcode（模型名不变，
# 两边都叫 deepseek/deepseek-v4.1-flash）。
#
# 想换免费档：把 model 改成 `ar/deepseek-v4-flash`（AgentRouter 免费档）。实测该
# 档在真实客服流程里全部正常：知识库检索并给出处、合约核对走 lookup_* 工具、
# mermaid/html 块 render/passed、面对「我有哪些合約」照样拒绝枚举。免费档只有
# 一个上游、没有故障转移，故默认仍用付费多上游；两档都已注册在 provider 的模型
# 列表里，Admin 的模型选择器可直接切换对比，不必重新部署。
- id: agent-default-model
  config:
    provider: litellm
    model: deepseek/deepseek-v4.1-flash

# ── 会话标题的辅助模型上限 ─────────────────────────────────────────────────
# 官方默认 maxOutputTokens=64 是从「不思考的模型」推出来的。commandcode 网关对
# deepseek-v4.1-flash 强制开启思考（实测传 reasoning_effort:"off" 直接 400：
# Invalid option: expected one of "low"|"medium"|"high"|"xhigh"|"max"），64 个
# token 会被推理段全部吃光：finish_reason="length"、content=""，官方 provider 抛
# 「title output reached maxOutputTokens」，每个访客会话都在容器日志里留一条告警，
# 标题退化成截断首句。实测 512 才够（reasoning_tokens≈200 + 标题）。标题是访客
# 在「历史会话」列表里看到的门面，不能长期退化，故在此显式提高上限。
- id: session-title-llm
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 512
    timeoutMs: 60000

# ── Guest 游客 HTTP 桥 + 输出前自审门禁（host 层）──────────────────────────
# 匿名访客对话 JSON API（/api/guest/*），驱动 customer-service-guest preset
# 会话。路径在 Docker 内固定为 /app/customer-service。
#
# 行序有意义：guest-server 用 `ctx.get('outputGate')` 取门禁服务，因此 output-gate
# 必须排在它前面，保证访客桥的第一个请求就已经带门禁。
- insert:
    # ── 输出前自审门禁 ────────────────────────────────────────────────────
    # 三条访客出口（/chat、/chat/stream、/history）的收口：受控图形围栏
    # （mermaid/chart/image/html）在主机侧被摘成结构化块，围栏源码不进任何载荷。
    # 下列取值即需求 v3.2 §13 冻结默认值，显式写出便于部署方单点调整。
    # 无任何事后重写开关：REP1 冻结「不做事后重写」，门禁不做第二次模型调用。
    - id: output-gate
      name: '/app/customer-service/plugins/output-gate/src/index.ts'
      config:
        gate:
          enabled: true
          # 单块 validating 判定超时（captain 冻结）
          blockTimeoutMs: 1500
          # done 前结算的收尾窗口（P7 并行语义，非串行总配额）
          answerWaitBudgetMs: 600
          # 渲染器（mermaid 库）就绪上限：与判定计时分离，否则首图必被误降级
          libraryLoadTimeoutMs: 8000
          # 单块字节上限：超出直接降级（不渲染、不下发源码）
          maxBlockBytes: 32768
          # 图片可达性探测：结论仅留痕，不参与放行（C6，v3.2）
          serverImageProbe: true
          serverImageProbeTimeoutMs: 2000
          reportPath: '/api/guest/render-report'
    - id: guest-server
      name: '/app/customer-service/plugins/guest-server/src/index.ts'
      config:
        preset: customer-service-guest
        workspace: /kb
        # 部署构建戳：guest-server/服务有变更时递增，报障"工号+版本"即可定位是哪个构建在答。
        # 本次递增理由：输出前自审门禁落地（主机侧围栏状态机 + 三出口收口 + 前端块槽位渲染
        # 与表格/CRLF/NO_GATE 加固）。注意本值是**镜像构建戳**：改源码值不等于生效——须重建镜像，
        # 之后 /api/guest/health 的 version 才会反映新值；不重建则线上仍报旧值。
        serviceVersion: '2026-09-11.18'
        # Customer-service Q&A is retrieval-grounded: pin a low reasoning
        # effort so one uncertain turn cannot burn ~15-20s on a long internal
        # reasoning chain before the first answer token reaches the visitor.
        reasoningEffort: low
